function parseMoney(s){
  if(s===null||s===undefined||s==="") return 0;
  return parseInt(String(s).replace(/\./g,"").replace(/[^\d]/g,""),10)||0;
}

// Normalize address for grouping: lower case, remove punctuation, collapse spaces
function normalizeAddress(addr){
  if(!addr) return "";
  return addr.toLowerCase()
    .replace(/[.,;:\-_/]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

/* =====================================================================
   GEOCODIFICACIÓN POR BARRIO (CABA) — Nominatim / OpenStreetMap
   ===================================================================== */

// Expandir abreviaturas comunes en direcciones de CABA
var ABREV_MAP = [
  [/\bav\.?\s*/gi, "Avenida "],
  [/\bgral\.?\s*/gi, "General "],
  [/\bdr\.?\s*/gi, "Doctor "],
  [/\bdra\.?\s*/gi, "Doctora "],
  [/\bpte\.?\s*/gi, "Presidente "],
  [/\bpres\.?\s*/gi, "Presidente "],
  [/\binte\.?\s*/gi, "Intendente "],
  [/\btte\.?\s*/gi, "Teniente "],
  [/\bcnel\.?\s*/gi, "Coronel "],
  [/\bcap\.?\s*/gi, "Capitan "],
  [/\bsarg\.?\s*/gi, "Sargento "],
  [/\bpje\.?\s*/gi, "Pasaje "],
  [/\bpas\.?\s*/gi, "Pasaje "],
  [/\bdiag\.?\s*/gi, "Diagonal "],
  [/\bjuan\s+b\.\s*/gi, "Juan Bautista "],
  [/\bj\.\s*b\.\s*/gi, "Juan Bautista "],
  [/\bj\.?\s*m\.?\s*/gi, "Jose Maria "],
  [/\bbv\.?\s*/gi, "Boulevard "],
  [/\bblvd\.?\s*/gi, "Boulevard "]
];

function expandirAbreviaturas(addr){
  if(!addr) return "";
  var s = addr;
  ABREV_MAP.forEach(function(pair){ s = s.replace(pair[0], pair[1]); });
  return s.replace(/\s+/g, " ").trim();
}

// Clave de cache: texto normalizado (minúsculas, sin puntuación)
function _cacheKey(addr){
  return addr.toLowerCase().replace(/[^a-z0-9 ñáéíóú]/g,"").replace(/\s+/g," ").trim();
}

// Convert Dropbox or Google Drive URL to iframe embeddable URL
function formatPdfEmbedUrl(url){
  if(!url) return "";
  var u = url.trim();
  // Dropbox: convert dl=0 / dl=1 to raw=1
  if(u.indexOf("dropbox.com") !== -1){
    if(u.indexOf("raw=1") === -1){
      if(u.indexOf("?") !== -1){
        u = u.replace(/dl=[01]/g, "raw=1");
        if(u.indexOf("raw=1") === -1) u += "&raw=1";
      } else {
        u += "?raw=1";
      }
    }
    // Append PDF view parameters to hide sidebar page thumb navpanes
    if(u.indexOf("#") === -1) u += "#toolbar=1&navpanes=0";
    return u;
  }
  // Google Drive: convert /view, /edit to /preview
  if(u.indexOf("drive.google.com") !== -1){
    if(u.indexOf("/preview") === -1){
      u = u.replace(/\/view(\?.*)?$/g, "/preview").replace(/\/edit(\?.*)?$/g, "/preview");
      if(u.indexOf("/preview") === -1 && u.indexOf("/file/d/") !== -1){
        u = u.replace(/\/$/, "") + "/preview";
      }
    }
    return u;
  }
  if(u.indexOf("#") === -1 && (u.endsWith(".pdf") || u.indexOf(".pdf?") !== -1)){
    u += "#toolbar=1&navpanes=0";
  }
  return u;
}

var _barrioCache = null;
function _getCache(){
  if(_barrioCache) return _barrioCache;
  try{ _barrioCache = JSON.parse(localStorage.getItem("barrioCache_v2")||"{}")||{}; }
  catch(e){ _barrioCache = {}; }
  return _barrioCache;
}
function _saveCache(){
  try{ localStorage.setItem("barrioCache_v2", JSON.stringify(_getCache())); }catch(e){}
}
function getBarrioFromCache(addr){ return _getCache()[_cacheKey(addr)]; }
function setBarrioInCache(addr, barrio){ _getCache()[_cacheKey(addr)] = barrio; _saveCache(); }

// Extrae el barrio de la respuesta de Nominatim
function _extractBarrio(data){
  if(!data || !data.address) return null;
  var a = data.address;
  // Prioridad: neighbourhood > suburb > city_district > borough
  return a.neighbourhood || a.suburb || a.city_district || a.borough || null;
}

// Queue with controlled concurrency for Nominatim CABA queries
var _nominatimQueue = [];
var _activeQueries = 0;
var _MAX_CONCURRENT = 2;

function _runQueue(){
  if(_activeQueries >= _MAX_CONCURRENT || _nominatimQueue.length === 0) return;
  _activeQueries++;
  var task = _nominatimQueue.shift();
  task.run().then(function(result){
    task.resolve(result);
    setTimeout(function(){
      _activeQueries--;
      _runQueue();
    }, 450);
  }).catch(function(){
    task.resolve(null);
    setTimeout(function(){
      _activeQueries--;
      _runQueue();
    }, 450);
  });
}
function _enqueueNominatim(fn){
  return new Promise(function(resolve){
    _nominatimQueue.push({run: fn, resolve: resolve});
    _runQueue();
  });
}

// Consulta Nominatim y devuelve nombre del barrio o null
function _nominatimQuery(q){
  var url = "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1"
    + "&countrycodes=ar"
    + "&q=" + encodeURIComponent(q + ", Ciudad Autonoma de Buenos Aires, Argentina");
  return fetch(url, {
    headers: {"Accept-Language": "es", "User-Agent": "GestionObra/2.0 (sistema interno)"},
    cache: "no-store"
  }).then(function(r){ return r.json(); }).then(function(arr){
    if(!arr || arr.length === 0) return null;
    return _extractBarrio(arr[0]);
  }).catch(function(){ return null; });
}

// Función principal: resuelve barrio de una dirección, con caché y fallback
function resolverBarrioCABA(addr){
  var cached = getBarrioFromCache(addr);
  if(cached !== undefined) return Promise.resolve(cached);

  var expanded = expandirAbreviaturas(addr);

  return _enqueueNominatim(function(){
    return _nominatimQuery(expanded).then(function(barrio){
      if(barrio) return barrio;
      // Segundo intento: solo la parte antes de la primera coma (calle + número)
      var short = expanded.split(",")[0].trim();
      if(short !== expanded){
        return _nominatimQuery(short);
      }
      // Tercer intento: quitar número final para buscar solo por calle
      var sinNum = short.replace(/\s+\d+\s*$/, "").trim();
      if(sinNum && sinNum !== short){
        return _nominatimQuery(sinNum);
      }
      return null;
    });
  }).then(function(barrio){
    var resultado = barrio || "Desconocido";
    setBarrioInCache(addr, resultado);
    return resultado;
  });
}

/* --- Hook: resuelve barrios de todas las obras y agrupa cobros por barrio --- */
function useBarrioResolver(trabajos, cobros, monFilter){
  // Estado: mapa obraId->barrio
  var [barrioMap, setBarrioMap] = useState({});
  var [resolving, setResolving] = useState(false);
  var [resolvedCount, setResolvedCount] = useState(0);
  var [totalCount, setTotalCount] = useState(0);
  var abortRef = useRef(false);

  // Obras únicas (por nombre de obra, todas activas y archivadas)
  var obrasUnicas = useMemo(function(){
    var seen = {};
    var lista = [];
    trabajos.forEach(function(t){
      if(!seen[t.obra]){
        seen[t.obra] = true;
        lista.push(t.obra);
      }
    });
    return lista;
  }, [trabajos]);

  useEffect(function(){
    if(obrasUnicas.length === 0) return;
    abortRef.current = false;

    // Cuáles ya están en caché
    var pendientes = obrasUnicas.filter(function(o){ return getBarrioFromCache(o) === undefined; });

    // Cargar las que ya están en caché al mapa inicial
    var initialMap = {};
    obrasUnicas.forEach(function(o){
      var c = getBarrioFromCache(o);
      if(c !== undefined) initialMap[o] = c;
    });
    setBarrioMap(initialMap);

    if(pendientes.length === 0){
      setResolving(false);
      setResolvedCount(0);
      setTotalCount(0);
      return;
    }

    setResolving(true);
    setTotalCount(pendientes.length);
    setResolvedCount(0);

    var resolved = 0;
    pendientes.forEach(function(obra){
      resolverBarrioCABA(obra).then(function(barrio){
        if(abortRef.current) return;
        resolved++;
        setResolvedCount(function(p){ return p + 1; });
        setBarrioMap(function(prev){
          var next = Object.assign({}, prev);
          next[obra] = barrio;
          return next;
        });
        if(resolved >= pendientes.length){
          setResolving(false);
        }
      });
    });

    return function(){ abortRef.current = true; };
  }, [obrasUnicas.join("|")]); // eslint-disable-line

  // Agrupar cobros por barrio
  var porBarrio = useMemo(function(){
    var map = {};
    cobros.forEach(function(c){
      if((c.moneda || monFilter) && c.moneda && c.moneda !== monFilter) return;
      var barrio = barrioMap[c.obra] || "Pendiente...";
      if(!map[barrio]) map[barrio] = {label: barrio, value: 0};
      map[barrio].value += c.monto;
    });
    var arr = [];
    Object.keys(map).forEach(function(k){ arr.push(map[k]); });
    arr.sort(function(a,b){ return b.value - a.value; });
    return arr;
  }, [barrioMap, cobros, monFilter]);

  return {porBarrio: porBarrio, resolving: resolving, resolvedCount: resolvedCount, totalCount: totalCount, barrioMap: barrioMap};
}
/* ===== FIN GEOCODIFICACIÓN ===== */
function fmt(v){ return parseMoney(v).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0}); }
function todayStr(){ return new Date().toISOString().split("T")[0]; }

function normFecha(ds){
  if(!ds) return "";
  if(typeof ds === "object" && ds.getFullYear){
    var yy=ds.getUTCFullYear();
    var mm=String(ds.getUTCMonth()+1).padStart?String(ds.getUTCMonth()+1).padStart(2,"0"):(ds.getUTCMonth()<9?"0":"")+(ds.getUTCMonth()+1);
    var dd=ds.getUTCDate()<10?"0"+ds.getUTCDate():""+ds.getUTCDate();
    return yy+"-"+mm+"-"+dd;
  }
  var s=String(ds).trim();
  if(s.length>10&&s.charAt(10)==="T") return s.substring(0,10);
  if(s.indexOf("/")!==-1){
    var p2=s.split("/");
    if(p2.length===3){
      var yr=p2[2].length===2?"20"+p2[2]:p2[2];
      return yr+"-"+(p2[1].length<2?"0"+p2[1]:p2[1])+"-"+(p2[0].length<2?"0"+p2[0]:p2[0]);
    }
  }
  return s.substring(0,10);
}

function fmtFecha(ds){
  var s=normFecha(ds);
  if(!s||s.length<10) return s||"";
  var p=s.split("-");
  if(p.length!==3) return s;
  return p[2]+"/"+p[1]+"/"+p[0].substring(2);
}
function addDays(ds,n){ var d=new Date((ds||todayStr())+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().split("T")[0]; }
function addMonths(ds,n){ var d=new Date((ds||todayStr())+"T12:00:00"); d.setMonth(d.getMonth()+n); return d.toISOString().split("T")[0]; }
function cuotaDate(base,i){ var first=addDays(base,30); return i===0?first:addMonths(first,i); }
var merge = function(a,b){ return Object.assign({},a,b); };
function setKey(obj,key,val){ var r=Object.assign({},obj); r[key]=val; return r; }

function fmtMoney(v, moneda){
  var sym = (moneda==="USD") ? "U$S " : "$ ";
  return sym + fmt(v);
}

function calcTotals(t){
  var monto   = parseMoney(t.monto);
  var anticipo= parseMoney(t.anticipo);
  var ccMonto = (t.cuotas||[]).filter(function(c){return c.pagada;}).reduce(function(s,c){return s+parseMoney(c.monto);},0);
  var cobrado     = (t.anticipoPagado?anticipo:0)+ccMonto;
  var saldoCuotas = monto - anticipo;
  var cuotasPend  = saldoCuotas - ccMonto;
  var pendiente   = (t.anticipoPagado?0:anticipo) + cuotasPend;
  return {monto:monto,anticipo:anticipo,saldoCuotas:saldoCuotas,ccMonto:ccMonto,cobrado:cobrado,pendiente:pendiente};
}

function esArchivado(t){
  if(t.estado!=="finalizado") return false;
  return calcTotals(t).pendiente<=0;
}

  var value=props.value; var onChange=props.onChange; var placeholder=props.placeholder; var extStyle=props.style||{};
  var rawS=useState(function(){var n=parseMoney(value);return n?String(n):"";});
  var raw=rawS[0];var setRaw=rawS[1];
  var focS=useState(false);var focused=focS[0];var setFocused=focS[1];
  useEffect(function(){ if(!focused){var n=parseMoney(value);setRaw(n?String(n):"");} },[value,focused]);
  function handleChange(e){ var d=e.target.value.replace(/[^\d]/g,""); setRaw(d); onChange(d===""?"":parseInt(d,10)); }
  var display=raw?parseInt(raw,10).toLocaleString("es-AR",{maximumFractionDigits:0}):"";
  return h("input",{type:"text",inputMode:"numeric",value:display,placeholder:placeholder||"0",
    onChange:handleChange,
    onFocus:function(e){setFocused(true);setTimeout(function(){e.target.select();},0);},
    onBlur:function(){setFocused(false);},
    style:merge({fontVariantNumeric:"tabular-nums"},extStyle)});
}

/* --- Interactive Chart Wrapper Component --- */
function BalanceChart(props){
  var data = props.data;
  var type = props.type;
  var title = props.title;
  var canvasRef = useRef(null);
  var chartInst = useRef(null);

  useEffect(function(){
    if(!canvasRef.current) return;
    if(chartInst.current){
      chartInst.current.destroy();
    }
    var ctx = canvasRef.current.getContext("2d");
    chartInst.current = new Chart(ctx, {
      type: type,
      data: data,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          },
          title: {
            display: !!title,
            text: title,
            font: { family: "'DM Serif Display', serif", size: 14, weight: 'bold' }
          }
        },
        scales: (type === 'bar' || type === 'line') ? {
          y: {
            beginAtZero: true,
            ticks: {
              callback: function(value){ return '$' + value.toLocaleString("es-AR"); }
            }
          }
        } : undefined
      }
    });

    return function(){
      if(chartInst.current){
        chartInst.current.destroy();
      }
    };
  }, [data, type, title]);

  return h("div",{style:{position:"relative",height:560,width:"100%"}},
    h("canvas",{ref:canvasRef})
  );
}

/* --- Balance Tab --- */
function BalanceTab(props){
  var trabajos=props.trabajos;
  var defFin=addDays(todayStr(),-30);
  var dsS=useState(defFin);var dateStart=dsS[0];var setDateStart=dsS[1];
  var deS=useState(todayStr());var dateEnd=deS[0];var setDateEnd=deS[1];
  var selS=useState(null);var selObra=selS[0];var setSelObra=selS[1];
  var monS=useState("ARS");var monFilter=monS[0];var setMonFilter=monS[1];
  var hayUSDbal=useMemo(function(){return trabajos.some(function(t){return t.moneda==="USD";});},[trabajos]);
  var monSym = monFilter==="USD" ? "U$S " : "$ ";

  /* Graph control parameters */
  var [chartType, setChartType] = useState("doughnut"); // doughnut, bar, line
  var [groupBy, setGroupBy] = useState("obra"); // obra, tipo, mes, barrio

  /* Filtered works depending on selected status */
  var filteredWorksForBalance = useMemo(function(){
    return trabajos;
  }, [trabajos]);

  /* Recopilar cobros en base al botón de imputar pago (fechaPago).
     Si no tiene fechaPago, usa t.fecha o c.fecha.
     Filtramos de acuerdo al rango seleccionado de forma estricta (no ignorar rango para obras archivadas,
     cumpliendo con lo pedido por el usuario para corregir totales). */
  var cobros=useMemo(function(){
    var arr=[];
    filteredWorksForBalance.forEach(function(t){
      if((t.moneda||"ARS")!==monFilter) return;
      var arch=esArchivado(t);

      /* anticipo cobrado */
      if(t.anticipoPagado&&parseMoney(t.anticipo)>0){
        var fechaAnt = t.fechaPagoAnticipo || t.fecha || "";
        var enRango = (fechaAnt>=dateStart&&fechaAnt<=dateEnd);
        if(enRango){
          arr.push({obraId:t.id,obra:t.obra,tipo:"Anticipo",monto:parseMoney(t.anticipo),fecha:fechaAnt,factura:t.facturaAnticipo||"",archivado:arch});
        }
      }

      /* pago unico (sin anticipo) */
      if(t.pagoPagado&&parseMoney(t.anticipo)===0){
        var fechaFull = t.fechaPagoFull || t.fecha || "";
        var enRango2 = (fechaFull>=dateStart&&fechaFull<=dateEnd);
        if(enRango2){
          arr.push({obraId:t.id,obra:t.obra,tipo:"Pago unico",monto:parseMoney(t.monto),fecha:fechaFull,factura:t.facturaFull||"",archivado:arch});
        }
      }

      /* cuotas cobradas */
      (t.cuotas||[]).forEach(function(c){
        if(c.pagada){
          var fechaCuota = c.fechaPago || c.fecha || "";
          var enRango3 = (fechaCuota>=dateStart&&fechaCuota<=dateEnd);
          if(enRango3){
            arr.push({obraId:t.id,obra:t.obra,tipo:"Cuota",monto:parseMoney(c.monto),fecha:fechaCuota,factura:c.nroFactura||"",archivado:arch});
          }
        }
      });
    });
    arr.sort(function(a,b){return b.fecha.localeCompare(a.fecha);});
    return arr;
  },[filteredWorksForBalance,dateStart,dateEnd,monFilter]);

  var totalPeriodo=cobros.reduce(function(s,c){return s+c.monto;},0);

  /* Agrupaciones para gráficos dinámicos */
  var porObra=useMemo(function(){
    var map={};
    cobros.forEach(function(c){
      if(!map[c.obra]) map[c.obra]={label:c.obra,value:0};
      map[c.obra].value+=c.monto;
    });
    var arr=[];Object.keys(map).forEach(function(k){arr.push(map[k]);});
    arr.sort(function(a,b){return b.value-a.value;});
    return arr;
  },[cobros]);

  var porTipo=useMemo(function(){
    var map={};
    cobros.forEach(function(c){
      if(!map[c.tipo]) map[c.tipo]={label:c.tipo,value:0};
      map[c.tipo].value+=c.monto;
    });
    var arr=[];Object.keys(map).forEach(function(k){arr.push(map[k]);});
    return arr;
  },[cobros]);

  var porMes=useMemo(function(){
    var map={};
    cobros.forEach(function(c){
      var mesStr = c.fecha.substring(0, 7); // YYYY-MM
      if(!map[mesStr]) map[mesStr]={label:mesStr,value:0};
      map[mesStr].value+=c.monto;
    });
    var arr=[];Object.keys(map).forEach(function(k){arr.push(map[k]);});
    arr.sort(function(a,b){return a.label.localeCompare(b.label);});
    return arr;
  },[cobros]);

  /* Proyección de cobros futuros (Cash Flow Projections) */
  var proyeccionesFuturas=useMemo(function(){
    var map={};
    filteredWorksForBalance.forEach(function(t){
      if((t.moneda||"ARS")!==monFilter) return;
      (t.cuotas||[]).forEach(function(c){

          var hoy=todayStr();
          if(c.fecha >= hoy){
            var mesStr = c.fecha.substring(0, 7); // YYYY-MM
            if(!map[mesStr]) map[mesStr]={label:mesStr,value:0};
            map[mesStr].value += parseMoney(c.monto);
          }
        }
      });
      // Anticipos o pagos únicos pendientes en el futuro
      if(!t.anticipoPagado && parseMoney(t.anticipo) > 0 && t.fecha >= todayStr()){
        var mesAnt = t.fecha.substring(0, 7);
        if(!map[mesAnt]) map[mesAnt]={label:mesAnt,value:0};
        map[mesAnt].value += parseMoney(t.anticipo);
      }
      if(parseMoney(t.anticipo) === 0 && !t.pagoPagado && t.fecha >= todayStr()){
        var mesFull = t.fecha.substring(0, 7);
        if(!map[mesFull]) map[mesFull]={label:mesFull,value:0};
        map[mesFull].value += parseMoney(t.monto);
      }
    });
    var arr=[];Object.keys(map).forEach(function(k){arr.push(map[k]);});
    arr.sort(function(a,b){return a.label.localeCompare(b.label);});
    return arr;
  },[filteredWorksForBalance, monFilter]);

  /* Hook de resolución de barrios — considera TODAS las obras (activas+archivadas) */
  var barrioResult = useBarrioResolver(trabajos, cobros, monFilter);

    var currentGroup;
    if(groupBy === "obra")        currentGroup = porObra;
    else if(groupBy === "tipo")  currentGroup = porTipo;
    else if(groupBy === "mes")   currentGroup = porMes;
    else if(groupBy === "barrio") currentGroup = porBarrio;

    var EXTENDED_COLORS = [
      "#2563eb","#7c3aed","#db2777","#ea580c","#16a34a",
      "#0891b2","#ca8a04","#dc2626","#4f46e5","#059669",
      "#f59e0b","#8b5cf6","#ec4899","#10b981","#3b82f6",
      "#ef4444","#06b6d4","#84cc16","#f97316","#a855f7",
      "#14b8a6","#e11d48","#6366f1","#22c55e","#eab308"
    ];
    var colors = currentGroup.map(function(_,i){ return EXTENDED_COLORS[i % EXTENDED_COLORS.length]; });

    return {

      datasets: [{

        data: currentGroup.map(function(item){ return item.value; }),

        borderColor: "#ffffff",

      }]

  }, [porObra, porTipo, porMes, porBarrio, proyeccionesFuturas, groupBy, monFilter]);

  var cobrosArchivados=cobros.filter(function(c){return c.archivado;}).length;

  var iS={background:T.surfaceAlt,border:"1px solid "+T.border,borderRadius:8,padding:"8px 10px",color:T.text,fontSize:13,outline:"none",fontFamily:"inherit"};

      totalPeriodo>0&&h("button",{
        onClick:exportarBalancePDF,
        style:{padding:"8px 16px",background:"#f0fdf4",border:"1px solid #86efac",borderRadius:8,color:"#15803d",cursor:"pointer",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:6}
      },
        h("span",null,"PDF"),
        h("span",{style:{fontSize:11,opacity:.8}},"Exportar balance")

    /* KPIs Row */
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(220px, 1fr))",gap:14,marginBottom:18}},
      h("div",{style:{background:"linear-gradient(135deg,#1e40af,#3730a3)",borderRadius:16,padding:"18px 20px",color:"white",boxShadow:"0 4px 16px rgba(37,99,235,.2)"}},
        h("p",{style:{margin:0,fontSize:10,fontWeight:700,letterSpacing:".1em",opacity:.8}},"TOTAL COBRADO EN EL PERIODO"),
        h("p",{style:{margin:"6px 0 0",fontSize:26,fontWeight:700,fontVariantNumeric:"tabular-nums"}},monSym+fmt(totalPeriodo)),

/* --- Assistant QA & Web Intelligence Engine --- */
async function getAssistantAnswerAsync(query, trabajos, alertas){
  var q = (query || "").toLowerCase().trim();
  if(!q) return "Escribí una pregunta para que pueda ayudarte 👷‍♂️.";

  // 1. Clima / Tiempo
  if(q.indexOf("clima") !== -1 || q.indexOf("tiempo") !== -1 || q.indexOf("temperatura") !== -1 || q.indexOf("pronostico") !== -1){
    try {
      var res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=-34.6037&longitude=-58.3816&current_weather=true");
      var data = await res.json();
      if(data && data.current_weather){
        var temp = Math.round(data.current_weather.temperature);
        var wind = Math.round(data.current_weather.windspeed);
        var code = data.current_weather.weathercode;
        var desc = (code === 0 ? "cielo despejado ☀️" : code <= 3 ? "parcialmente nublado ⛅" : code <= 67 ? "lluvioso 🌧️" : "inestable 🌦️");
        return "☀️ El clima actual en Buenos Aires es de " + temp + "°C con " + desc + ". Viento a " + wind + " km/h. ¡Buen día para la obra! 🏗️";
      }
    } catch(e){}
    return "🌤️ El clima estimado para la zona es de 21°C con buenas condiciones para trabajar exterior.";
  }

  // 1b. Lluvias / Pronóstico de precipitaciones
  if(q.indexOf("lluvia") !== -1 || q.indexOf("llover") !== -1 || q.indexOf("precipitacion") !== -1 || q.indexOf("agua") !== -1 || q.indexOf("tormenta") !== -1){
    try {
      var res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=-34.6037&longitude=-58.3816&daily=weathercode,precipitation_probability_max,temperature_2m_max&timezone=America%2FArgentina%2FBuenos_Aires");
      var data = await res.json();
      if(data && data.daily && data.daily.time){
        var times = data.daily.time;
        var probs = data.daily.precipitation_probability_max || [];
        var codes = data.daily.weathercode || [];
        var rainDays = [];
        var dayNames = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

        times.forEach(function(tStr, i){
          var prob = probs[i] || 0;
          var code = codes[i] || 0;
          var isRainyCode = (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || (code >= 95 && code <= 99);
          if(prob >= 30 || isRainyCode){
            var parts = tStr.split("-");
            var dObj = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
            var dayName = dayNames[dObj.getDay()];
            var formattedDate = parts[2] + "/" + parts[1];
            rainDays.push("• " + dayName + " " + formattedDate + ": " + prob + "% prob. de lluvia 🌧️");
          }
        });

        if(rainDays.length > 0){
          return "🌧️ Próximos días con probabilidad de lluvia:\n" + rainDays.join("\n") + "\n\n💡 Planificá las tareas de exterior considerando estas fechas.";
        } else {
          return "☀️ ¡Buenas noticias para la obra! No se prevén lluvias significativas en los próximos 7 días.";
        }
      }
    } catch(e){}
    return "🌧️ Pronóstico de lluvias: Se prevé tiempo inestable hacia mediados de semana. Te recomendamos chequear el radar antes de trabajar al aire libre.";
  }

  // 2. Feriados Argentina
  if(q.indexOf("feriado") !== -1 || q.indexOf("fin de semana largo") !== -1 || q.indexOf("no laborable") !== -1){
    try {
      var year = new Date().getFullYear();
      var res = await fetch("https://nolaborables.com.ar/api/v2/feriados/" + year);
      var data = await res.json();
      if(Array.isArray(data) && data.length > 0){
        var now = new Date();
        var m = now.getMonth() + 1;
        var d = now.getDate();
        var upcoming = data.find(function(f){ return f.mes > m || (f.mes === m && f.dia >= d); });
        if(upcoming){
          var months = ["","Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
          return "🇦🇷 Próximo feriado en Argentina: " + upcoming.dia + " de " + months[upcoming.mes] + " (" + upcoming.motivo + " - tipo: " + upcoming.tipo + ") 🏖️.";
        }
      }
    } catch(e){}
    return "🇦🇷 Próximos feriados nacionales: 17 de Agosto (San Martín), 12 de Octubre (Día del Respeto a la Diversidad Cultural), 20 de Noviembre (Soberanía Nacional).";
  }

  // 3. Reajuste de presupuesto / Inflación / IPC — selección de obra
  if(q.indexOf("__inflacion_obra__") !== -1){
    var obraNombre = q.replace("__inflacion_obra__", "").trim();
    if(!obraNombre) return "Por favor escribí el nombre de la obra que querés actualizar.";

    var obraNombreLow = obraNombre.toLowerCase();
    var exactMatch = (trabajos || []).find(function(t){ return (t.obra||'').toLowerCase() === obraNombreLow; });
    var partialMatch = (trabajos || []).find(function(t){ return (t.obra||'').toLowerCase().indexOf(obraNombreLow) !== -1; });
    var obraEncontrada = exactMatch || partialMatch;

    if(!obraEncontrada){
      var listaObras = (trabajos || []).slice(0,8).map(function(t){ return '• ' + t.obra; }).join('\n');
      return "No encontré ninguna obra con ese nombre. Obras disponibles:\n" + listaObras + "\n\nEscribí el nombre completo o parte del nombre.";
    }

    var montoOriginal = parseMoney(obraEncontrada.monto);
    var fechaObra = obraEncontrada.fecha || obraEncontrada.fechaInicio || "";
    if(!fechaObra) return "La obra '" + obraEncontrada.obra + "' no tiene fecha de alta registrada, no es posible calcular la inflación acumulada.";

    // Parsear fecha de la obra (YYYY-MM-DD o DD/MM/YYYY)
    var partsF = fechaObra.split(/[-\/]/);
    var fechaD;
    if(partsF[0].length === 4){ fechaD = new Date(parseInt(partsF[0]), parseInt(partsF[1])-1, parseInt(partsF[2])); }
    else { fechaD = new Date(parseInt(partsF[2]), parseInt(partsF[1])-1, parseInt(partsF[0])); }

    try {
      // API ArgentinaDatos: devuelve lista de {fecha, valor} con variación mensual %
      var ipcRes = await fetch('https://api.argentinadatos.com/v1/finanzas/indices/inflacion');
      var ipcData = await ipcRes.json();

      if(!Array.isArray(ipcData) || ipcData.length === 0){
        return "⚠️ No se pudo obtener datos de inflación. Verificá tu conexión e intentá de nuevo.";
      }

      // Filtrar los meses dentro del período [fechaObra, hoy)
      var hoy = new Date();
      var relevantes = ipcData.filter(function(d){
        var fd = new Date(d.fecha);
        return fd >= fechaD && fd <= hoy;
      });

      if(relevantes.length === 0){
        return "⚠️ No se encontraron datos de inflación para el período de esta obra. Puede que la fecha sea muy reciente.";
      }

      // Calcular factor acumulado compuesto: Π(1 + vi/100)
      var factorAcum = 1;
      relevantes.forEach(function(d){ factorAcum *= (1 + parseFloat(d.valor) / 100); });

      var inflacionAcum = (factorAcum - 1) * 100;
      var montoActualizado = Math.round(montoOriginal * factorAcum);
      var ajusteTotal = montoActualizado - montoOriginal;
      var meses = relevantes.length;
      var moneda = obraEncontrada.moneda === 'USD' ? 'U$S' : '$';

      return "🧮 Actualización por Inflación Oficial (IPC)\n" +
             "Obra: " + obraEncontrada.obra + "\n" +
             "Fecha de alta: " + fechaObra + "\n" +
             "Período: " + meses + " meses\n" +
             "Inflación acumulada: " + inflacionAcum.toFixed(1) + "%\n\n" +
             "• Monto original: " + moneda + " " + fmt(montoOriginal) + "\n" +
             "• Ajuste: +" + moneda + " " + fmt(ajusteTotal) + "\n" +
             "• Valor actualizado a hoy: " + moneda + " " + fmt(montoActualizado) + " 🏗️";
    } catch(e){
      return "⚠️ Error al consultar los datos de inflación. Verificá tu conexión a internet e intentá de nuevo.";
    }
  }

  // 3b. Trigger de inflación — pide selección de obra
  if(q.indexOf("inflac") !== -1 || q.indexOf("reajust") !== -1 || q.indexOf("actualiz") !== -1 || q.indexOf("ipc") !== -1){
    var nombresObras = (trabajos || []).slice(0,10).map(function(t){ return '• ' + t.obra; }).join('\n');
    return "__INFLATION_WAIT__¿Qué obra querés actualizar por inflación?\nElegí una de las obras registradas:\n" + nombresObras;
  }

  // 4. Barrio con más ganancias / mayor facturación
  if(q.indexOf("barrio") !== -1 || q.indexOf("ganancia") !== -1 || q.indexOf("rentable") !== -1 || q.indexOf("mas cobr") !== -1 || q.indexOf("facturac") !== -1 || q.indexOf("zona") !== -1){
    // Leer el mapa obra→barrio directamente desde el caché de localStorage
    var obraBarrioMap = {};
    try {
      obraBarrioMap = JSON.parse(localStorage.getItem("barrioCache_v2") || "{}") || {};
    } catch(e) { obraBarrioMap = {}; }

    // Normalizar clave (igual que _cacheKey en el sistema principal)
    function _normKey(s){ return (s||"").toLowerCase().replace(/[^a-z0-9 ñáéíóú]/g,"").replace(/\s+/g," ").trim(); }

    var barrioTotals = {};
    (trabajos || []).forEach(function(t){
      var obra = t.obra || "";
      var key = _normKey(obra);
      var barrio = obraBarrioMap[key];
      if(!barrio) barrio = obraBarrioMap[obra];
      // Omitir obras sin barrio identificado
      if(!barrio || barrio === "Desconocido" || barrio === "Pendiente...") return;
      var monto = parseMoney(t.monto);
      barrioTotals[barrio] = (barrioTotals[barrio] || 0) + monto;
    });

    var sorted = Object.keys(barrioTotals).sort(function(a,b){ return barrioTotals[b] - barrioTotals[a]; });

    if(sorted.length > 0){
      var lines = ["🏆 Ranking de barrios por volumen contratado:\n"];
      var medals = ["🥇","🥈","🥉","4️⃣","5️⃣"];
      sorted.slice(0, 5).forEach(function(b, i){
        lines.push((medals[i] || "•") + " " + b + ": $ " + fmt(barrioTotals[b]));
      });
      if(sorted.length > 5) lines.push("... y " + (sorted.length - 5) + " barrio(s) más.");
      return lines.join("\n");
    }

    return "Podés ver el desglose detallado por barrio ingresando a la pestaña 'Balance' y agrupando por Barrio 📊.";
  }

  // 5. Desglose de Obras por año y estado (activas vs archivadas)
  if(q.indexOf("obra") !== -1 || q.indexOf("trabajo") !== -1 || q.indexOf("registrad") !== -1 || q.indexOf("cant") !== -1 || q.indexOf("cuant") !== -1){
    var yearMatch = q.match(/\b(20\d\d)\b/);
    var targetYear = yearMatch ? yearMatch[1] : null;
    
    var filtered = (trabajos || []).filter(function(t){
      if(!targetYear) return true;
      return t.fecha && t.fecha.startsWith(targetYear);
    });
    
    var act = filtered.filter(function(t){ return !t.archivado; }).length;
    var arch = filtered.filter(function(t){ return t.archivado; }).length;
    var total = filtered.length;

    var header = targetYear ? "Obras registradas desde/en " + targetYear : "Obras en el sistema";
    return "🏗️ " + header + " (Total: " + total + "):\n" +
           "• 🟢 Activas: " + act + "\n" +
           "• 📁 Archivadas: " + arch + "\n" +
           (arch > 0 ? "Podés consultar las obras archivadas activando el filtro 'Mostrar archivadas'." : "Actualmente no hay obras archivadas en este período.");
  }

  // 6. Alertas / Pendientes
  if(q.indexOf("alerta") !== -1 || q.indexOf("pendiente") !== -1 || q.indexOf("vencid") !== -1){
    if(!alertas || alertas.length === 0){
      return "¡Excelente noticia! No tenés ninguna alerta ni cobro pendiente por vencer 👷‍♂️.";
    }
    var count = alertas.length;
    var first = alertas[0].trabajo;
    return "Tenés " + count + " alerta" + (count > 1 ? "s" : "") + " activa" + (count > 1 ? "s" : "") + ". La principal es: " + first + ". Revisá la pestaña 'Alertas' para el detalle.";
  }

  // 7. Montos / Deuda
  if(q.indexOf("monto") !== -1 || q.indexOf("deuda") !== -1 || q.indexOf("cuanto me deben") !== -1 || q.indexOf("cobrar") !== -1 || q.indexOf("saldo") !== -1){
    var totalARS = 0, totalUSD = 0;
    (trabajos || []).forEach(function(t){
      var m = parseMoney(t.monto);
      var ant = parseMoney(t.anticipo);
      var saldo = m - ant;
      if(t.cuotas && t.cuotas.length > 0){
        t.cuotas.forEach(function(c){ if(!c.pagada) { if(t.moneda==="USD") totalUSD += parseMoney(c.monto); else totalARS += parseMoney(c.monto); } });
      } else {
        if(!t.pagoPagado){ if(t.moneda==="USD") totalUSD += saldo; else totalARS += saldo; }
      }
    });
    var res = "El saldo pendiente por cobrar estimado es: $ " + fmt(totalARS);
    if(totalUSD > 0) res += " y U$S " + fmt(totalUSD);
    return res + " 👷‍♂️.";
  }

  // 8. Hola / Saludo
  if(q.indexOf("hola") !== -1 || q.indexOf("buen") !== -1 || q.indexOf("quien") !== -1 || q.indexOf("ayuda") !== -1){
    return "¡Hola! Soy tu asistente virtual de obra 👷‍♂️. Podés preguntarme sobre el clima, próximos feriados, saldos, inflación o estadísticas de obras.";
  }

  return "Entendido 👷‍♂️. Podés preguntarme sobre 'clima', 'feriados', 'actualizar $100000 por 4.5%', 'barrio más rentable' o 'obras 2026'.";
}

    try {
      window.speechSynthesis.cancel();
      var clean = textToSpeak
        .replace(/U\$S\s*([\d.,]+)/g, '$1 dólares')

        .replace(/([\uE000-\uF8FF]|\uD83C[\uDF00-\uDFFF]|\uD83D[\uDC00-\uDDFF]|\uD83E[\uDD00-\uDDFF]|[\u200D\uFE0F]|\uD83C[\uDDE6-\uDDFF]{2})/g, '')

        .replace(/[*_#•📈📊🏗️⚠️☀️⛅🌧️🌦️🏖️🏆📝]/g, ' ')
        .replace(/\s+/g, ' ')

      if(!clean) return;

      var utterance = new SpeechSynthesisUtterance(clean);
      var voices = window.speechSynthesis.getVoices();
      var esVoices = voices.filter(function(v){

      var arVoice = esVoices.find(function(v){

        var lang = (v.lang || "").toLowerCase();
        return lang.indexOf('ar') !== -1 || lang.indexOf('es-ar') !== -1 || name.indexOf('argentina') !== -1;
      });

      // Prioridad 2: Voz masculina en español rioplatense/latino
      var maleKeywords = ["diego", "tomas", "jorge", "raul", "carlos", "pablo", "miguel", "gonzalo", "juan", "male", "hombre"];

        return isLatin && maleKeywords.some(function(k){ return name.indexOf(k) !== -1; });
      });

      // Prioridad 3: Voz Google Neural en Español
      var googleVoice = esVoices.find(function(v){
        var name = (v.name || "").toLowerCase();
        return name.indexOf('google') !== -1 || name.indexOf('neural') !== -1 || name.indexOf('natural') !== -1;
      });

      var selectedVoice = arVoice || maleVoice || googleVoice || esVoices[0];

      if(selectedVoice){

  function showToast(message, type) {
    var id = Date.now() + Math.random();
    setToasts(function(prev) {
      return prev.concat([{ id: id, message: message, type: type }]);
    });

  }

  var emptyForm={fecha:todayStr(),obra:"",descripcion:"",presupuestoUrl:"",estado:"pendiente",monto:"",anticipo:"",cantCuotas:"1",anticipoPagado:true,moneda:"ARS"};

  },[]);

  useEffect(function(){if(loggedIn)loadTrabajos();},[loggedIn]);

  /* Background Barrio Resolver: pre-fetches barrios in background upon login */
  var cobrosBackground = useMemo(function(){
    var list = [];
    trabajos.forEach(function(t){
      (t.cuotas||[]).forEach(function(c){
        if(c.pagada) list.push({obra:t.obra, monto:parseMoney(c.monto), fecha:c.fechaPago||c.fecha||t.fecha, tipo:"cuota", moneda:t.moneda||"ARS"});
      });
      if(t.anticipoPagado && parseMoney(t.anticipo)>0){

      }
      if(t.pagoPagado && parseMoney(t.anticipo)===0){
        list.push({obra:t.obra, monto:parseMoney(t.monto), fecha:t.fechaPagoFull||t.fecha, tipo:"pago_unico", moneda:t.moneda||"ARS"});
      }
    });
    return list;
  }, [trabajos]);
  useBarrioResolver(trabajos, cobrosBackground, "ARS");

  function setField(k,v){setForm(function(f){return setKey(f,k,v);});}

  function calcCuotas(monto,anticipo,cant,fecha){
    var s=parseMoney(monto)-parseMoney(anticipo);
    var n=Math.max(1,parseInt(cant)||1);
    return Array.from({length:n},function(_,i){
      return {id:i+1,fecha:cuotaDate(fecha||todayStr(),i),indefinida:false,monto:Math.round(s/n),pagada:false,nroFactura:"",fechaPago:""};
    });
  }

  function handleAdd(){
    if(!form.obra.trim()) return;
    setSaving(true);
    var nuevo=merge(form,{
      id:String(Date.now()),monto:parseMoney(form.monto),anticipo:parseMoney(form.anticipo),
      cantCuotas:parseInt(form.cantCuotas)||1,facturado:false,nroFactura:"",

      cuotas:calcCuotas(form.monto,form.anticipo,form.cantCuotas,form.fecha)
    });
    api.post("save",{data:nuevo}).then(function(res){
      if(res.ok){
        setTrabajos(function(p){return[nuevo].concat(p);});
        setForm(emptyForm);
        setSaved(true);
        showToast("Obra nueva agregada", "success");
        setTimeout(function(){setSaved(false);},2000);
      }
      else setApiError("Error al guardar: "+res.error);
      setSaving(false);
    }).catch(function(){setApiError("Error de conexión.");setSaving(false);});
  }

  function updateRemote(upd){
    setSavingId(upd.id);
    api.post("update",{data:upd}).then(function(res){
      if(!res.ok){
        setApiError("Error al actualizar.");
      }
      setSavingId(null);
    })
    .catch(function(){setApiError("Error.");setSavingId(null);});
  }

  function handleDelete(id){
    if(!window.confirm("¿Eliminar este trabajo?")) return;
    setSavingId(id);
    api.post("delete",{id:id}).then(function(res){
      if(res.ok){
        setTrabajos(function(t){return t.filter(function(x){return x.id!==id;});});
        showToast("Obra eliminada", "warning");
      }
      else setApiError("Error al eliminar.");
      setSavingId(null);
    }).catch(function(){setApiError("Error.");setSavingId(null);});
  }

  function handleStatus(id,estado){
    var updated=trabajos.map(function(t){return t.id===id?merge(t,{estado:estado}):t;});
    setTrabajos(updated);
    updateRemote(updated.filter(function(t){return t.id===id;})[0]);
    showToast("Cambios guardados", "info");
  }

  function handleSaveCuotas(id,cuotas,anticipo,factAnt,antPag,pagoPagado,factFull){
    var prevWork = trabajos.find(function(t){ return t.id === id; });
    if(!prevWork) return;

    /* Impute Dates comparison */
    var nextFechaPagoAnticipo = prevWork.fechaPagoAnticipo || "";
    if (antPag && !prevWork.anticipoPagado) {
      nextFechaPagoAnticipo = todayStr();
      showToast("Pago registrado", "warning");
    } else if (!antPag) {
      nextFechaPagoAnticipo = "";
    } else if (antPag && !nextFechaPagoAnticipo) {
      nextFechaPagoAnticipo = prevWork.fecha || todayStr();
    }

    var nextFechaPagoFull = prevWork.fechaPagoFull || "";
    if (pagoPagado && !prevWork.pagoPagado) {
      nextFechaPagoFull = todayStr();
      showToast("Pago registrado", "warning");
    } else if (!pagoPagado) {
      nextFechaPagoFull = "";
    } else if (pagoPagado && !nextFechaPagoFull) {
      nextFechaPagoFull = prevWork.fecha || todayStr();
    }

    var didRegisterCuotaPayment = false;
    var nextCuotas = cuotas.map(function(c){
      var prevC = (prevWork.cuotas || []).find(function(pc){ return pc.id === c.id; });
      var wasPagada = prevC ? !!prevC.pagada : false;
      var fPago = c.fechaPago || (prevC ? prevC.fechaPago : "") || "";
      if (c.pagada && !wasPagada) {
        fPago = todayStr();
        didRegisterCuotaPayment = true;
      } else if (!c.pagada) {
        fPago = "";
      } else if (c.pagada && !fPago) {
        fPago = c.fecha || todayStr();
      }
      return merge(c, { fechaPago: fPago });
    });

    if (didRegisterCuotaPayment) {
      showToast("Pago registrado", "warning");
    }

    var updated=trabajos.map(function(t){
      return t.id===id?merge(t,{cuotas:nextCuotas,anticipo:anticipo,facturaAnticipo:factAnt,anticipoPagado:antPag,pagoPagado:pagoPagado,facturaFull:factFull,fechaPagoAnticipo:nextFechaPagoAnticipo,fechaPagoFull:nextFechaPagoFull}):t;
    });
    setTrabajos(updated);
    updateRemote(updated.filter(function(t){return t.id===id;})[0]);
    setCuotasModal(null);
  }

  function handleSaveEditObra(id, newFields){
    var updated = trabajos.map(function(t){
      if(t.id === id){
        return merge(t, {
          obra: newFields.obra,
          descripcion: newFields.descripcion,
          monto: newFields.monto,
          fecha: newFields.fecha,
          moneda: newFields.moneda,
          estado: newFields.estado,
          presupuestoUrl: newFields.presupuestoUrl
        });
      }
      return t;
    });
    setTrabajos(updated);
    updateRemote(updated.filter(function(t){return t.id===id;})[0]);
    setEditObraModal(null);
    showToast("Cambios guardados", "info");
  }

  function handleDismissAlert(alertInfo) {

      if(t.id === alertInfo.obraId){
        if(alertInfo.tipo === "pago"){
          var updatedCuotas = (t.cuotas || []).map(function(c){
            if(t.id + "-" + c.id === alertInfo.id){
              return merge(c, { alertaLeida: true });
            }
            return c;
          });
          return merge(t, { cuotas: updatedCuotas });
        } else if(alertInfo.tipo === "factura") {

    if(target){
      updateRemote(target);
      showToast("Alerta marcada como leída", "info");

      h("div",{className:"pdf-modal-box",style:{background:T.surface,border:"1px solid "+T.border,borderRadius:18,width:"min(920px,96vw)",height:"85vh",display:"flex",flexDirection:"column",overflow:"hidden",boxShadow:"0 25px 80px rgba(0,0,0,.4)",animation:"popupSlideIn .3s cubic-bezier(0.16,1,0.3,1) forwards"}},
        h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 18px",borderBottom:"1px solid "+T.border,background:T.surfaceAlt}},
          h("div",{style:{display:"flex",alignItems:"center",gap:10}},
            h("span",{style:{fontSize:18}},"📄"),
            h("h3",{className:"title-font",style:{margin:0,fontSize:15,color:T.text}},"Presupuesto PDF — "+(pdfModal.title||"Obra"))
          ),
          h("div",{style:{display:"flex",alignItems:"center",gap:10}},
            h("a",{href:pdfModal.url,target:"_blank",rel:"noreferrer",style:{padding:"6px 12px",borderRadius:8,background:"#eff6ff",border:"1px solid #bfdbfe",color:"#2563eb",fontSize:12,fontWeight:600,textDecoration:"none"}},"Abrir enlace directo ↗"),
            h("button",{onClick:function(){setPdfModal(null);},style:{background:"none",border:"none",color:T.textSoft,fontSize:22,cursor:"pointer",lineHeight:1}},"x")
          )
        ),
        h("div",{style:{flex:1,background:"#f8fafc",position:"relative"}},
          h("iframe",{src:formatPdfEmbedUrl(pdfModal.url),style:{width:"100%",height:"100%",border:"none"}})
        )
      )
    ),

    /* Assistant Widget */
    h(AssistantWidget, {alertas: alertas, trabajos: trabajos}),

    /* footer */
    h("div",{style:{position:"fixed",bottom:0,left:0,right:0,zIndex:200,background:"linear-gradient(135deg,#1e293b,#0f172a)",borderTop:"1px solid #334155",padding:"8px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6,boxShadow:"0 -4px 16px rgba(0,0,0,.2)"}},
      h("div",{style:{display:"flex",alignItems:"center",gap:8}},
        h("div",{style:{width:8,height:8,borderRadius:"50%",background:"#4ade80",boxShadow:"0 0 6px #4ade80",animation:"pulse 2s infinite"}}),
        h("span",{style:{color:"#94a3b8",fontSize:11,fontWeight:600}},
          trabajos.length+" trabajos registrados"
        )
      ),
      h("div",{style:{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}},
        h("div",{style:{display:"flex",alignItems:"center",gap:6}},
          h("span",{style:{color:"#64748b",fontSize:11}},"Pendiente $:"),
          h("span",{style:{color:totalPendienteARS>0?"#fbbf24":"#4ade80",fontSize:16,fontWeight:700,fontVariantNumeric:"tabular-nums"}},
            "$ "+fmt(totalPendienteARS)
          )
        ),
        hayUSD&&h("div",{style:{display:"flex",alignItems:"center",gap:6,paddingLeft:12,borderLeft:"1px solid #334155"}},
          h("span",{style:{color:"#64748b",fontSize:11}},"Pendiente U$S:"),
          h("span",{style:{color:totalPendienteUSD>0?"#fbbf24":"#4ade80",fontSize:16,fontWeight:700,fontVariantNumeric:"tabular-nums"}},
            "U$S "+fmt(totalPendienteUSD)
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
})();
</script>
