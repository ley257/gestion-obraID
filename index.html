  align-items: center;
  justify-content: center;
  gap: 15px;
  z-index: 10000;

  background: rgba(10, 15, 32, 0.52);

  align-items: center;
  justify-content: center;

function parseMoney(s){
  if(s===null||s===undefined||s==="") return 0;
  return parseInt(String(s).replace(/\./g,"").replace(/[^\d]/g,""),10)||0;
}

// Normalize address for grouping: lower case, remove punctuation, collapse spaces
function normalizeAddress(addr){
  if(!addr) return "";
  return addr.toLowerCase()
    .replace(/[.,;:\-_/]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
function fmt(v){ return parseMoney(v).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0}); }
function todayStr(){ return new Date().toISOString().split("T")[0]; }

function normFecha(ds){
  if(!ds) return "";
  if(typeof ds === "object" && ds.getFullYear){
    var yy=ds.getUTCFullYear();
    var mm=String(ds.getUTCMonth()+1).padStart?String(ds.getUTCMonth()+1).padStart(2,"0"):(ds.getUTCMonth()<9?"0":"")+(ds.getUTCMonth()+1);
    var dd=ds.getUTCDate()<10?"0"+ds.getUTCDate():""+ds.getUTCDate();
    return yy+"-"+mm+"-"+dd;
  }
  var s=String(ds).trim();
  if(s.length>10&&s.charAt(10)==="T") return s.substring(0,10);
  if(s.indexOf("/")!==-1){
    var p2=s.split("/");
    if(p2.length===3){
      var yr=p2[2].length===2?"20"+p2[2]:p2[2];
      return yr+"-"+(p2[1].length<2?"0"+p2[1]:p2[1])+"-"+(p2[0].length<2?"0"+p2[0]:p2[0]);
    }
  }
  return s.substring(0,10);
}

function fmtFecha(ds){
  var s=normFecha(ds);
  if(!s||s.length<10) return s||"";
  var p=s.split("-");
  if(p.length!==3) return s;
  return p[2]+"/"+p[1]+"/"+p[0].substring(2);
}
function addDays(ds,n){ var d=new Date((ds||todayStr())+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().split("T")[0]; }
function addMonths(ds,n){ var d=new Date((ds||todayStr())+"T12:00:00"); d.setMonth(d.getMonth()+n); return d.toISOString().split("T")[0]; }
function cuotaDate(base,i){ var first=addDays(base,30); return i===0?first:addMonths(first,i); }
var merge = function(a,b){ return Object.assign({},a,b); };
function setKey(obj,key,val){ var r=Object.assign({},obj); r[key]=val; return r; }

function fmtMoney(v, moneda){
  var sym = (moneda==="USD") ? "U$S " : "$ ";
  return sym + fmt(v);
}

function calcTotals(t){
  var monto   = parseMoney(t.monto);
  var anticipo= parseMoney(t.anticipo);
  var ccMonto = (t.cuotas||[]).filter(function(c){return c.pagada;}).reduce(function(s,c){return s+parseMoney(c.monto);},0);
  var cobrado     = (t.anticipoPagado?anticipo:0)+ccMonto;
  var saldoCuotas = monto - anticipo;
  var cuotasPend  = saldoCuotas - ccMonto;
  var pendiente   = (t.anticipoPagado?0:anticipo) + cuotasPend;
  return {monto:monto,anticipo:anticipo,saldoCuotas:saldoCuotas,ccMonto:ccMonto,cobrado:cobrado,pendiente:pendiente};
}

function esArchivado(t){
  if(t.estado!=="finalizado") return false;
  return calcTotals(t).pendiente<=0;
}

/* --- MoneyInput --- */
function MoneyInput(props){
  var value=props.value; var onChange=props.onChange; var placeholder=props.placeholder; var extStyle=props.style||{};
  var rawS=useState(function(){var n=parseMoney(value);return n?String(n):"";});
  var raw=rawS[0];var setRaw=rawS[1];
  var focS=useState(false);var focused=focS[0];var setFocused=focS[1];
  useEffect(function(){ if(!focused){var n=parseMoney(value);setRaw(n?String(n):"");} },[value,focused]);
  function handleChange(e){ var d=e.target.value.replace(/[^\d]/g,""); setRaw(d); onChange(d===""?"":parseInt(d,10)); }
  var display=raw?parseInt(raw,10).toLocaleString("es-AR",{maximumFractionDigits:0}):"";
  return h("input",{type:"text",inputMode:"numeric",value:display,placeholder:placeholder||"0",
    onChange:handleChange,
    onFocus:function(e){setFocused(true);setTimeout(function(){e.target.select();},0);},
    onBlur:function(){setFocused(false);},
    style:merge({fontVariantNumeric:"tabular-nums"},extStyle)});
}

/* --- Interactive Chart Wrapper Component --- */
function BalanceChart(props){
  var data = props.data;
  var type = props.type;
  var title = props.title;
  var canvasRef = useRef(null);
  var chartInst = useRef(null);

  useEffect(function(){
    if(!canvasRef.current) return;
    if(chartInst.current){
      chartInst.current.destroy();
    }
    var ctx = canvasRef.current.getContext("2d");
    chartInst.current = new Chart(ctx, {
      type: type,
      data: data,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          },
          title: {
            display: !!title,
            text: title,
            font: { family: "'DM Serif Display', serif", size: 14, weight: 'bold' }
          }
        },
        scales: (type === 'bar' || type === 'line') ? {
          y: {
            beginAtZero: true,
            ticks: {
              callback: function(value){ return '$' + value.toLocaleString("es-AR"); }
            }
          }
        } : undefined
      }
    });

    return function(){
      if(chartInst.current){
        chartInst.current.destroy();
      }
    };
  }, [data, type, title]);

  return h("div",{style:{position:"relative",height:560,width:"100%"}},
    h("canvas",{ref:canvasRef})
  );
}

/* --- Balance Tab --- */
function BalanceTab(props){
  var trabajos=props.trabajos;
  var defFin=addDays(todayStr(),-30);
  var dsS=useState(defFin);var dateStart=dsS[0];var setDateStart=dsS[1];
  var deS=useState(todayStr());var dateEnd=deS[0];var setDateEnd=deS[1];
  var selS=useState(null);var selObra=selS[0];var setSelObra=selS[1];
  var monS=useState("ARS");var monFilter=monS[0];var setMonFilter=monS[1];
  var hayUSDbal=useMemo(function(){return trabajos.some(function(t){return t.moneda==="USD";});},[trabajos]);
  var monSym = monFilter==="USD" ? "U$S " : "$ ";

  /* Graph control parameters */
  var [chartType, setChartType] = useState("doughnut"); // doughnut, bar, line
  var [groupBy, setGroupBy] = useState("obra"); // obra, tipo, mes

  /* Filtered works depending on selected status */
  var filteredWorksForBalance = useMemo(function(){
    return trabajos;
  }, [trabajos]);

  /* Recopilar cobros en base al botón de imputar pago (fechaPago).
     Si no tiene fechaPago, usa t.fecha o c.fecha.
     Filtramos de acuerdo al rango seleccionado de forma estricta (no ignorar rango para obras archivadas,
     cumpliendo con lo pedido por el usuario para corregir totales). */
  var cobros=useMemo(function(){
    var arr=[];
    filteredWorksForBalance.forEach(function(t){
      if((t.moneda||"ARS")!==monFilter) return;
      var arch=esArchivado(t);

      /* anticipo cobrado */
      if(t.anticipoPagado&&parseMoney(t.anticipo)>0){
        var fechaAnt = t.fechaPagoAnticipo || t.fecha || "";
        var enRango = (fechaAnt>=dateStart&&fechaAnt<=dateEnd);
        if(enRango){
          arr.push({obraId:t.id,obra:t.obra,tipo:"Anticipo",monto:parseMoney(t.anticipo),fecha:fechaAnt,factura:t.facturaAnticipo||"",archivado:arch});
        }
      }

      /* pago unico (sin anticipo) */
      if(t.pagoPagado&&parseMoney(t.anticipo)===0){
        var fechaFull = t.fechaPagoFull || t.fecha || "";
        var enRango2 = (fechaFull>=dateStart&&fechaFull<=dateEnd);
        if(enRango2){
          arr.push({obraId:t.id,obra:t.obra,tipo:"Pago unico",monto:parseMoney(t.monto),fecha:fechaFull,factura:t.facturaFull||"",archivado:arch});
        }
      }

      /* cuotas cobradas */
      (t.cuotas||[]).forEach(function(c){
        if(c.pagada){
          var fechaCuota = c.fechaPago || c.fecha || "";
          var enRango3 = (fechaCuota>=dateStart&&fechaCuota<=dateEnd);
          if(enRango3){
            arr.push({obraId:t.id,obra:t.obra,tipo:"Cuota",monto:parseMoney(c.monto),fecha:fechaCuota,factura:c.nroFactura||"",archivado:arch});
          }
        }
      });
    });
    arr.sort(function(a,b){return b.fecha.localeCompare(a.fecha);});
    return arr;
  },[filteredWorksForBalance,dateStart,dateEnd,monFilter]);

  var totalPeriodo=cobros.reduce(function(s,c){return s+c.monto;},0);

  /* Agrupaciones para gráficos dinámicos */
  var porObra=useMemo(function(){
    var map={};
    cobros.forEach(function(c){
      if(!map[c.obra]) map[c.obra]={label:c.obra,value:0};
      map[c.obra].value+=c.monto;
    });
    var arr=[];Object.keys(map).forEach(function(k){arr.push(map[k]);});
    arr.sort(function(a,b){return b.value-a.value;});
    return arr;
  },[cobros]);

  var porTipo=useMemo(function(){
    var map={};
    cobros.forEach(function(c){
      if(!map[c.tipo]) map[c.tipo]={label:c.tipo,value:0};
      map[c.tipo].value+=c.monto;
    });
    var arr=[];Object.keys(map).forEach(function(k){arr.push(map[k]);});
    return arr;
  },[cobros]);

  var porMes=useMemo(function(){
    var map={};
    cobros.forEach(function(c){
      var mesStr = c.fecha.substring(0, 7); // YYYY-MM
      if(!map[mesStr]) map[mesStr]={label:mesStr,value:0};
      map[mesStr].value+=c.monto;
    });
    var arr=[];Object.keys(map).forEach(function(k){arr.push(map[k]);});
    arr.sort(function(a,b){return a.label.localeCompare(b.label);});
    return arr;
  },[cobros]);

  /* Proyección de cobros futuros (Cash Flow Projections) */
  var proyeccionesFuturas=useMemo(function(){
    var map={};
    filteredWorksForBalance.forEach(function(t){
      if((t.moneda||"ARS")!==monFilter) return;
      (t.cuotas||[]).forEach(function(c){
        if(!c.pagada && !c.indefinida){
          var hoy=todayStr();
          if(c.fecha >= hoy){
            var mesStr = c.fecha.substring(0, 7); // YYYY-MM
            if(!map[mesStr]) map[mesStr]={label:mesStr,value:0};
            map[mesStr].value += parseMoney(c.monto);
          }
        }
      });
      // Anticipos o pagos únicos pendientes en el futuro
      if(!t.anticipoPagado && parseMoney(t.anticipo) > 0 && t.fecha >= todayStr()){
        var mesAnt = t.fecha.substring(0, 7);
        if(!map[mesAnt]) map[mesAnt]={label:mesAnt,value:0};
        map[mesAnt].value += parseMoney(t.anticipo);
      }
      if(parseMoney(t.anticipo) === 0 && !t.pagoPagado && t.fecha >= todayStr()){
        var mesFull = t.fecha.substring(0, 7);
        if(!map[mesFull]) map[mesFull]={label:mesFull,value:0};
        map[mesFull].value += parseMoney(t.monto);
      }
    });
    var arr=[];Object.keys(map).forEach(function(k){arr.push(map[k]);});
    arr.sort(function(a,b){return a.label.localeCompare(b.label);});
    return arr;
  },[filteredWorksForBalance, monFilter]);

  /* Formatear datos para Chart.js */
  var chartData = useMemo(function(){
    var currentGroup = groupBy === "obra" ? porObra : (groupBy === "tipo" ? porTipo : porMes);
    if(groupBy === "proyeccion") currentGroup = proyeccionesFuturas;

    return {
      labels: currentGroup.map(function(item){ return item.label; }),
      datasets: [{
        label: "Monto ("+monFilter+")",
        data: currentGroup.map(function(item){ return item.value; }),
        backgroundColor: CHART_COLORS.slice(0, currentGroup.length),
        borderColor: "#ffffff",
        borderWidth: 2
      }]
    };
  }, [porObra, porTipo, porMes, proyeccionesFuturas, groupBy, monFilter]);

  var cobrosArchivados=cobros.filter(function(c){return c.archivado;}).length;
  var detalle=selObra?cobros.filter(function(c){return c.obra===selObra;}):cobros;
  var iS={background:T.surfaceAlt,border:"1px solid "+T.border,borderRadius:8,padding:"8px 10px",color:T.text,fontSize:13,outline:"none",fontFamily:"inherit"};

  function exportarBalancePDF(){
    printHTML(buildBalanceHTML(cobros,totalPeriodo,porObra,porTipo,dateStart,dateEnd,monFilter),"balance");
  }

  return h("div",{style:{padding:16,maxWidth:1000,margin:"0 auto",paddingBottom:80}},
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},
      h("h2",{style:{fontFamily:"'DM Serif Display',serif",fontSize:24,margin:0,color:T.text}},"Dashboard de Balance"),
      totalPeriodo>0&&h("button",{
        onClick:exportarBalancePDF,
        style:{padding:"8px 16px",background:"#f0fdf4",border:"1px solid #86efac",borderRadius:8,color:"#15803d",cursor:"pointer",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:6}
      },
        h("span",null,"PDF"),
        h("span",{style:{fontSize:11,opacity:.8}},"Exportar balance")
      )
    ),

    /* KPIs Row */
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(220px, 1fr))",gap:14,marginBottom:18}},
      h("div",{style:{background:"linear-gradient(135deg,#1e40af,#3730a3)",borderRadius:16,padding:"18px 20px",color:"white",boxShadow:"0 4px 16px rgba(37,99,235,.2)"}},
        h("p",{style:{margin:0,fontSize:10,fontWeight:700,letterSpacing:".1em",opacity:.8}},"TOTAL COBRADO EN EL PERIODO"),
        h("p",{style:{margin:"6px 0 0",fontSize:26,fontWeight:700,fontVariantNumeric:"tabular-nums"}},monSym+fmt(totalPeriodo)),
        h("p",{style:{margin:"4px 0 0",fontSize:11,opacity:.75}},cobros.length+" cobros registrados")

/* --- App --- */
function App(){
  var liS=useState(false);var loggedIn=liS[0];var setLoggedIn=liS[1];
  var trS=useState([]);var trabajos=trS[0];var setTrabajos=trS[1];
  var loS=useState(true);var loading=loS[0];var setLoading=loS[1];
  var siS=useState(null);var savingId=siS[0];var setSavingId=siS[1];
  var svS=useState(false);var saving=svS[0];var setSaving=svS[1];
  var atS=useState("trabajos");var activeTab=atS[0];var setActiveTab=atS[1];
  var cmS=useState(null);var cuotasModal=cmS[0];var setCuotasModal=cmS[1];
  var edS=useState(null);var editObraModal=edS[0];var setEditObraModal=edS[1];
  var aeS=useState("");var apiError=aeS[0];var setApiError=aeS[1];
  var bqS=useState("");var busqueda=bqS[0];var setBusqueda=bqS[1];
  var maS=useState(false);var mostrarArch=maS[0];var setMostrarArch=maS[1];

  /* Toasts State */
  var [toasts, setToasts] = useState([]);

  function showToast(message, type) {
    var id = Date.now() + Math.random();
    setToasts(function(prev) {
      return prev.concat([{ id: id, message: message, type: type }]);
    });
    playPopupSound();
    setTimeout(function() {
      setToasts(function(prev) {
        return prev.filter(function(t) { return t.id !== id; });
      });
    }, 2500);
  }

  var emptyForm={fecha:todayStr(),obra:"",descripcion:"",estado:"pendiente",monto:"",anticipo:"",cantCuotas:"1",anticipoPagado:true,moneda:"ARS"};
  var fmS=useState(emptyForm);var form=fmS[0];var setForm=fmS[1];
  var sdS=useState(false);var saved=sdS[0];var setSaved=sdS[1];

  var loadTrabajos=useCallback(function(){
    setLoading(true);setApiError("");
    api.get("getAll").then(function(res){
      if(res.error){setApiError("Error: "+res.error);setTrabajos([]);}
      else {
        var ts=(res.trabajos||[]).map(function(t){
          return Object.assign({},t,{fecha:normFecha(t.fecha)});
        });
        setTrabajos(ts);
      }
      setLoading(false);
    }).catch(function(){setApiError("No se pudo conectar con la API.");setLoading(false);});
  },[]);

  useEffect(function(){if(loggedIn)loadTrabajos();},[loggedIn]);

  function setField(k,v){setForm(function(f){return setKey(f,k,v);});}

  function calcCuotas(monto,anticipo,cant,fecha){
    var s=parseMoney(monto)-parseMoney(anticipo);
    var n=Math.max(1,parseInt(cant)||1);
    return Array.from({length:n},function(_,i){
      return {id:i+1,fecha:cuotaDate(fecha||todayStr(),i),indefinida:false,monto:Math.round(s/n),pagada:false,nroFactura:"",fechaPago:""};
    });
  }

  function handleAdd(){
    if(!form.obra.trim()) return;
    setSaving(true);
    var nuevo=merge(form,{
      id:String(Date.now()),monto:parseMoney(form.monto),anticipo:parseMoney(form.anticipo),
      cantCuotas:parseInt(form.cantCuotas)||1,facturado:false,nroFactura:"",
      anticipoPagado:!!form.anticipoPagado,facturaAnticipo:"",pagoPagado:false,facturaFull:"",
      moneda:form.moneda||"ARS",
      fechaPagoAnticipo: form.anticipoPagado ? form.fecha : "",
      cuotas:calcCuotas(form.monto,form.anticipo,form.cantCuotas,form.fecha)
    });
    api.post("save",{data:nuevo}).then(function(res){
      if(res.ok){
        setTrabajos(function(p){return[nuevo].concat(p);});
        setForm(emptyForm);
        setSaved(true);
        showToast("Obra nueva agregada", "success");
        setTimeout(function(){setSaved(false);},2000);
      }
      else setApiError("Error al guardar: "+res.error);
      setSaving(false);
    }).catch(function(){setApiError("Error de conexión.");setSaving(false);});
  }

  function updateRemote(upd){
    setSavingId(upd.id);
    api.post("update",{data:upd}).then(function(res){
      if(!res.ok){
        setApiError("Error al actualizar.");
      }
      setSavingId(null);
    })
    .catch(function(){setApiError("Error.");setSavingId(null);});
  }

  function handleDelete(id){
    if(!window.confirm("¿Eliminar este trabajo?")) return;
    setSavingId(id);
    api.post("delete",{id:id}).then(function(res){
      if(res.ok){
        setTrabajos(function(t){return t.filter(function(x){return x.id!==id;});});
        showToast("Obra eliminada", "warning");
      }
      else setApiError("Error al eliminar.");
      setSavingId(null);
    }).catch(function(){setApiError("Error.");setSavingId(null);});
  }

  function handleStatus(id,estado){
    var updated=trabajos.map(function(t){return t.id===id?merge(t,{estado:estado}):t;});
    setTrabajos(updated);
    updateRemote(updated.filter(function(t){return t.id===id;})[0]);
    showToast("Cambios guardados", "info");
  }

  function handleSaveCuotas(id,cuotas,anticipo,factAnt,antPag,pagoPagado,factFull){
    var prevWork = trabajos.find(function(t){ return t.id === id; });
    if(!prevWork) return;

    /* Impute Dates comparison */
    var nextFechaPagoAnticipo = prevWork.fechaPagoAnticipo || "";
    if (antPag && !prevWork.anticipoPagado) {
      nextFechaPagoAnticipo = todayStr();
      showToast("Pago registrado", "warning");
    } else if (!antPag) {
      nextFechaPagoAnticipo = "";
    } else if (antPag && !nextFechaPagoAnticipo) {
      nextFechaPagoAnticipo = prevWork.fecha || todayStr();
    }

    var nextFechaPagoFull = prevWork.fechaPagoFull || "";
    if (pagoPagado && !prevWork.pagoPagado) {
      nextFechaPagoFull = todayStr();
      showToast("Pago registrado", "warning");
    } else if (!pagoPagado) {
      nextFechaPagoFull = "";
    } else if (pagoPagado && !nextFechaPagoFull) {
      nextFechaPagoFull = prevWork.fecha || todayStr();
    }

    var didRegisterCuotaPayment = false;
    var nextCuotas = cuotas.map(function(c){
      var prevC = (prevWork.cuotas || []).find(function(pc){ return pc.id === c.id; });
      var wasPagada = prevC ? !!prevC.pagada : false;
      var fPago = c.fechaPago || (prevC ? prevC.fechaPago : "") || "";
      if (c.pagada && !wasPagada) {
        fPago = todayStr();
        didRegisterCuotaPayment = true;
      } else if (!c.pagada) {
        fPago = "";
      } else if (c.pagada && !fPago) {
        fPago = c.fecha || todayStr();
      }
      return merge(c, { fechaPago: fPago });
    });

    if (didRegisterCuotaPayment) {
      showToast("Pago registrado", "warning");
    }

    var updated=trabajos.map(function(t){
      return t.id===id?merge(t,{cuotas:nextCuotas,anticipo:anticipo,facturaAnticipo:factAnt,anticipoPagado:antPag,pagoPagado:pagoPagado,facturaFull:factFull,fechaPagoAnticipo:nextFechaPagoAnticipo,fechaPagoFull:nextFechaPagoFull}):t;
    });
    setTrabajos(updated);
    updateRemote(updated.filter(function(t){return t.id===id;})[0]);
    setCuotasModal(null);
  }

  function handleSaveEditObra(id, newFields){
    var updated = trabajos.map(function(t){
      if(t.id === id){
        return merge(t, {
          obra: newFields.obra,
          descripcion: newFields.descripcion,
          monto: newFields.monto,
          fecha: newFields.fecha,
          moneda: newFields.moneda,
          estado: newFields.estado
        });
      }
      return t;
    });
    setTrabajos(updated);
    updateRemote(updated.filter(function(t){return t.id===id;})[0]);
    setEditObraModal(null);
    showToast("Cambios guardados", "info");
  }

  function handleDismissAlert(alertInfo) {
    var updated = trabajos.map(function(t){
      if(t.id === alertInfo.obraId){
        if(alertInfo.tipo === "pago"){
          var updatedCuotas = (t.cuotas || []).map(function(c){
            if(t.id + "-" + c.id === alertInfo.id){
              return merge(c, { alertaLeida: true });
            }
            return c;
          });
          return merge(t, { cuotas: updatedCuotas });
        } else if(alertInfo.tipo === "factura") {
          return merge(t, { facturaAlertaLeida: true });
        }
      }
      return t;
    });
    setTrabajos(updated);
    var target = updated.find(function(t){ return t.id === alertInfo.obraId; });
    if(target){
      updateRemote(target);
      showToast("Alerta marcada como leída", "info");
    }
  }

  var [groupOpenMap, setGroupOpenMap] = useState({});
  var [ungroupedKeys, setUngroupedKeys] = useState({});

  var trabajosFiltrados=useMemo(function(){
    var list=trabajos.slice().sort(function(a,b){
      var fa=normFecha(a.fecha||"");var fb=normFecha(b.fecha||"");
      if(fb>fa) return 1; if(fb<fa) return -1; return 0;
    });
    list=list.filter(function(t){return mostrarArch?esArchivado(t):!esArchivado(t);});
    if(busqueda.trim()){
      var q=busqueda.trim().toLowerCase();
      list=list.filter(function(t){return(t.obra||"").toLowerCase().indexOf(q)!==-1||(t.descripcion||"").toLowerCase().indexOf(q)!==-1;});
    }
    return list;
  },[trabajos,busqueda,mostrarArch]);

  /* Build grouped structure from trabajosFiltrados */
  var trabajosGrupos=useMemo(function(){
    var map={};
    trabajosFiltrados.forEach(function(t){
      var key=normalizeAddress(t.obra||"");
      if(!map[key]) map[key]={key:key,label:t.obra||"",items:[],maxFecha:""};
      map[key].items.push(t);
      var f=normFecha(t.fecha||"");
      if(f>map[key].maxFecha) { map[key].maxFecha=f; map[key].label=t.obra||""; }
    });
    var groups=Object.values(map);
    groups.sort(function(a,b){ return b.maxFecha<a.maxFecha?-1:b.maxFecha>a.maxFecha?1:0; });
    return groups;
  },[trabajosFiltrados]);

  var totalPendienteARS=useMemo(function(){
    return trabajos.filter(function(t){return !esArchivado(t)&&(t.moneda||"ARS")==="ARS";}).reduce(function(sum,t){
      return sum+calcTotals(t).pendiente;
    },0);
  },[trabajos]);
  var totalPendienteUSD=useMemo(function(){
    return trabajos.filter(function(t){return !esArchivado(t)&&t.moneda==="USD";}).reduce(function(sum,t){
      return sum+calcTotals(t).pendiente;
    },0);
  },[trabajos]);
  var hayUSD=useMemo(function(){return trabajos.some(function(t){return t.moneda==="USD";});},[trabajos]);

  var archivadosCount=useMemo(function(){return trabajos.filter(function(t){return esArchivado(t);}).length;},[trabajos]);

  /* Alertas Filtrando las marcadas como leídas */
  var alertas=useMemo(function(){
    var arr=[];
    trabajos.forEach(function(t){
      (t.cuotas||[]).forEach(function(c){
        if(!c.pagada&&!c.indefinida&&!c.alertaLeida){
          var diff=Math.ceil((new Date(c.fecha)-new Date())/86400000);
          if(diff<=30) arr.push({tipo:"pago",obraId:t.id,trabajo:t.obra,fecha:c.fecha,monto:c.monto,diff:diff,id:t.id+"-"+c.id});
        }
      });
      if(!t.facturado&&t.estado==="finalizado"&&!t.facturaAlertaLeida) {
        arr.push({tipo:"factura",obraId:t.id,trabajo:t.obra,diff:999,id:"fac-"+t.id});
      }
    });
    arr.sort(function(a,b){return a.diff-b.diff;});
    return arr;
  },[trabajos]);

  var iS={width:"100%",background:T.surfaceAlt,border:"1px solid "+T.border,borderRadius:10,padding:"10px 13px",color:T.text,fontSize:13,outline:"none",fontFamily:"inherit"};
  var lS={display:"block",color:T.textMid,fontSize:11,fontWeight:700,letterSpacing:".07em",marginBottom:5};

  if(!loggedIn) return h(Login,{onLogin:function(){ playLoginSound(); setLoggedIn(true); }});

  return h("div",{style:{minHeight:"100vh",background:T.bg,fontFamily:"'DM Sans',sans-serif",paddingBottom:52,overflowX:"hidden"}},

    /* Toast elements render */
    toasts.length > 0 && h("div",{className:"toast-container"},
      toasts.map(function(toast){
        var icon = toast.type === "success" ? "\u2714" : (toast.type === "warning" ? "\ud83d\udcb5" : "\ud83d\udcbe");
        var extraClass = toast.type === "success" ? "toast-success" : (toast.type === "warning" ? "toast-warning" : "toast-info");
        return h("div",{key:toast.id,className:"toast-item "+extraClass},
          h("div",{className:"toast-icon"}, icon),
          h("div",{className:"toast-text"}, toast.message)
        );

    /* header */
    h("div",{style:{background:T.surface,borderBottom:"1px solid "+T.border,padding:"0 13px",display:"flex",alignItems:"center",justifyContent:"space-between",height:52,position:"sticky",top:0,zIndex:100,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}},
