<div id="root"></div>

<!-- Overlay de diagnóstico: solo se muestra si ocurre un error -->
<div id="app-error-overlay">
  <h2>⚠️ Se produjo un error al iniciar GestionObra</h2>
  <div class="box">
    <div class="lbl">Mensaje</div>
    <pre id="err-msg">-</pre>
  </div>
  <div class="box">
    <div class="lbl">Ubicación</div>
    <pre id="err-loc">-</pre>
  </div>
  <div class="box">
    <div class="lbl">Stack</div>
    <pre id="err-stack">-</pre>
  </div>
  <div class="box">
    <div class="lbl">Diagnóstico de dependencias</div>
    <pre id="err-deps">-</pre>
  </div>
  <div>
    <button onclick="window.location.reload()">🔄 Reintentar</button>
    <button onclick="document.getElementById('app-error-overlay').style.display='none'">✖ Cerrar</button>
  </div>
</div>
<div id="app-boot-status"></div>

<!-- Diagnóstico temprano: corre ANTES del bundle principal -->
<script>
(function(){
  "use strict";
  var overlay=document.getElementById("app-error-overlay");
  var boot=document.getElementById("app-boot-status");
  var messages=[];

  function showOverlay(title,msg,loc,stack){
    overlay.style.display="block";
    document.getElementById("err-msg").textContent=title+"\n\n"+msg;
    document.getElementById("err-loc").textContent=loc||"(no disponible)";
    document.getElementById("err-stack").textContent=stack||"(sin stack)";
    document.getElementById("err-deps").textContent=
      "React: "+(typeof React!=="undefined"?("OK v"+(React.version||"?")):"❌ NO CARGADO")+"\n"+
      "ReactDOM: "+(typeof ReactDOM!=="undefined"?"OK":"❌ NO CARGADO")+"\n"+
      "Chart: "+(typeof Chart!=="undefined"?"OK":"⚠ no cargado (gráficos deshabilitados)")+"\n"+
      "Dropbox: "+(typeof Dropbox!=="undefined"?"OK":"⚠ no cargado (chooser deshabilitado)")+"\n"+
      "#root: "+(document.getElementById("root")?"OK":"❌ FALTA")+"\n"+
      "URL: "+window.location.href;
  }

  window.__showAppError=showOverlay;

  window.addEventListener("error",function(e){
    // Ignorar errores de recursos externos (imágenes, scripts de terceros)
    if(e.target&&e.target!==window&&e.target.tagName&&!/SCRIPT|LINK|IMG/.test(e.target.tagName)) return;
    if(e.target&&e.target.tagName==="SCRIPT"){
      var src=e.target.src||"(inline)";
      messages.push("Falló la carga de script: "+src);
      boot.style.display="block";
      boot.textContent="⚠ Falló la carga de: "+src+" — verificá tu conexión o bloqueadores.";
      return;
    }
    var msg=e.message||"Error desconocido";
    var loc=(e.filename||"")+":"+(e.lineno||"?")+":"+(e.colno||"?");
    var stack=(e.error&&e.error.stack)||"(sin stack)";
    showOverlay("Error global no capturado",msg,loc,stack);
  },true);

  window.addEventListener("unhandledrejection",function(e){
    var reason=e.reason;
    var msg=(reason&&reason.message)||String(reason);
    var stack=(reason&&reason.stack)||"(sin stack)";
    showOverlay("Promesa rechazada sin manejar",msg,"(async)",stack);
  });

  // Chequeo de dependencias al terminar la carga
  window.addEventListener("load",function(){
    var problemas=[];
    if(typeof React==="undefined") problemas.push("React NO se cargó desde unpkg.com");
    if(typeof ReactDOM==="undefined") problemas.push("ReactDOM NO se cargó desde unpkg.com");
    if(!document.getElementById("root")) problemas.push("Falta el div #root");
    if(problemas.length>0){
      showOverlay("Dependencias faltantes al iniciar","Se detectaron problemas al cargar la aplicación:\n\n• "+problemas.join("\n• "),"window.onload","");
    }
  });
})();
</script>

function _runQueue(){
  if(_activeQueries>=_MAX_CONCURRENT||_nominatimQueue.length===0) return;
  _activeQueries++;
  var task=_nominatimQueue.shift();
  task.run().then(function(r){ task.resolve(r); setTimeout(function(){ _activeQueries--; _runQueue(); },450); })
            .catch(function(){ task.resolve(null); setTimeout(function(){ _activeQueries--; _runQueue(); },450); });
}
function _enqueueNominatim(fn){ return new Promise(function(resolve){ _nominatimQueue.push({run:fn,resolve:resolve}); _runQueue(); }); }

function _nominatimQuery(q){
  var url="https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&countrycodes=ar&q="+encodeURIComponent(q+", Ciudad Autonoma de Buenos Aires, Argentina");
  return fetch(url,{headers:{"Accept-Language":"es","User-Agent":"GestionObra/2.0 (sistema interno)"},cache:"no-store"})
    .then(function(r){ return r.json(); })
    .then(function(arr){ if(!arr||arr.length===0) return null; return _extractBarrio(arr[0]); })
    .catch(function(){ return null; });
}

function resolverBarrioCABA(addr){
  var cached=getBarrioFromCache(addr);
  if(cached!==undefined) return Promise.resolve(cached);
  var expanded=expandirAbreviaturas(addr);
  return _enqueueNominatim(function(){
    return _nominatimQuery(expanded).then(function(barrio){
      if(barrio) return barrio;
      var short=expanded.split(",")[0].trim();
      if(short!==expanded) return _nominatimQuery(short);
      var sinNum=short.replace(/\s+\d+\s*$/,"").trim();
      if(sinNum && sinNum!==short) return _nominatimQuery(sinNum);
      return null;
    });
  }).then(function(barrio){ var r=barrio||"Desconocido"; setBarrioInCache(addr,r); return r; });
}

function useBarrioResolver(trabajos,cobros,monFilter){
  var barrioState=useState({});
  var barrioMap=barrioState[0], setBarrioMap=barrioState[1];
  var resolvingState=useState(false);
  var resolving=resolvingState[0], setResolving=resolvingState[1];
  var resolvedState=useState(0);
  var resolvedCount=resolvedState[0], setResolvedCount=resolvedState[1];
  var totalState=useState(0);
  var totalCount=totalState[0], setTotalCount=totalState[1];
  var abortRef=useRef(false);

  var obrasUnicas=useMemo(function(){
    var seen={}; var lista=[];
    (trabajos||[]).forEach(function(t){ if(!seen[t.obra]){ seen[t.obra]=true; lista.push(t.obra); } });
    return lista;
  },[trabajos]);

  var obrasKey=obrasUnicas.join("|");

  useEffect(function(){
    if(obrasUnicas.length===0) return;
    abortRef.current=false;
    var pendientes=obrasUnicas.filter(function(o){ return getBarrioFromCache(o)===undefined; });
    var initialMap={};
    obrasUnicas.forEach(function(o){ var c=getBarrioFromCache(o); if(c!==undefined) initialMap[o]=c; });
    setBarrioMap(initialMap);
    if(pendientes.length===0){ setResolving(false); setResolvedCount(0); setTotalCount(0); return; }
    setResolving(true); setTotalCount(pendientes.length); setResolvedCount(0);
    var resolved=0;
    pendientes.forEach(function(obra){
      resolverBarrioCABA(obra).then(function(barrio){
        if(abortRef.current) return;
        resolved++;
        setResolvedCount(function(p){ return p+1; });
        setBarrioMap(function(prev){ var n=Object.assign({},prev); n[obra]=barrio; return n; });
        if(resolved>=pendientes.length) setResolving(false);
      });
    });
    return function(){ abortRef.current=true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[obrasKey]);

  var porBarrio=useMemo(function(){
    var map={};
    (cobros||[]).forEach(function(c){
      if(c.moneda && c.moneda!==monFilter) return;
      var barrio=barrioMap[c.obra]||"Pendiente...";
      if(!map[barrio]) map[barrio]={label:barrio,value:0};
      map[barrio].value+=c.monto;
    });
    var arr=[]; Object.keys(map).forEach(function(k){ arr.push(map[k]); });
    arr.sort(function(a,b){ return b.value-a.value; });
    return arr;
  },[barrioMap,cobros,monFilter]);

  return {porBarrio:porBarrio,resolving:resolving,resolvedCount:resolvedCount,totalCount:totalCount,barrioMap:barrioMap};
}

function fmt(v){ return parseMoney(v).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0}); }
function todayStr(){ return new Date().toISOString().split("T")[0]; }

function normFecha(ds){
  if(!ds) return "";
  if(typeof ds==="object" && ds.getFullYear){
    var yy=ds.getUTCFullYear();
    var mm=String(ds.getUTCMonth()+1).padStart?String(ds.getUTCMonth()+1).padStart(2,"0"):(ds.getUTCMonth()<9?"0":"")+(ds.getUTCMonth()+1);
    var dd=ds.getUTCDate()<10?"0"+ds.getUTCDate():""+ds.getUTCDate();
    return yy+"-"+mm+"-"+dd;
  }
  var s=String(ds).trim();
  if(s.length>10 && s.charAt(10)==="T") return s.substring(0,10);
  if(s.indexOf("/")!==-1){
    var p2=s.split("/");
    if(p2.length===3){
      var yr=p2[2].length===2?"20"+p2[2]:p2[2];
      return yr+"-"+(p2[1].length<2?"0"+p2[1]:p2[1])+"-"+(p2[0].length<2?"0"+p2[0]:p2[0]);
    }
  }
  return s.substring(0,10);
}
function fmtFecha(ds){ var s=normFecha(ds); if(!s||s.length<10) return s||""; var p=s.split("-"); if(p.length!==3) return s; return p[2]+"/"+p[1]+"/"+p[0].substring(2); }
function addDays(ds,n){ var d=new Date((ds||todayStr())+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().split("T")[0]; }
function addMonths(ds,n){ var d=new Date((ds||todayStr())+"T12:00:00"); d.setMonth(d.getMonth()+n); return d.toISOString().split("T")[0]; }
function cuotaDate(base,i){ var first=addDays(base,30); return i===0?first:addMonths(first,i); }
function calcCuotas(monto,anticipo,cant,fecha){
  var s=parseMoney(monto)-parseMoney(anticipo);
  var n=Math.max(1,parseInt(cant)||1);
  return Array.from({length:n},function(_,i){
    return {id:i+1,fecha:cuotaDate(fecha||todayStr(),i),indefinida:false,monto:Math.round(s/n),pagada:false,nroFactura:"",fechaPago:""};
  });
}
var merge=function(a,b){ return Object.assign({},a,b); };
function setKey(obj,key,val){ var r=Object.assign({},obj); r[key]=val; return r; }

function fmtMoney(v,moneda){ var sym=(moneda==="USD")?"U$S ":"$ "; return sym+fmt(v); }

function calcTotals(t){
  var monto=parseMoney(t.monto);
  var anticipo=parseMoney(t.anticipo);
  var ccMonto=(t.cuotas||[]).filter(function(c){return c.pagada;}).reduce(function(s,c){return s+parseMoney(c.monto);},0);
  var cobrado=(t.anticipoPagado?anticipo:0)+ccMonto;
  var saldoCuotas=monto-anticipo;
  var cuotasPend=saldoCuotas-ccMonto;
  var pendiente=(t.anticipoPagado?0:anticipo)+cuotasPend;
  return {monto:monto,anticipo:anticipo,saldoCuotas:saldoCuotas,ccMonto:ccMonto,cobrado:cobrado,pendiente:pendiente};
}
function esArchivado(t){ if(t.estado!=="finalizado") return false; return calcTotals(t).pendiente<=0; }

  }

/* ===== Colecciones en la nube (Google Sheets) =====
   Clientes y presupuestos se guardan en Google Sheets igual que los trabajos.
   Cada registro viaja como objeto JSON completo (campos nuevos = aditivos). */
function useCloudList(col,loggedIn,notify,opts){
  opts=opts||{};
  var label=opts.label||col;
  var iS=useState([]); var items=iS[0], setItems=iS[1];
  var lS=useState(true); var loading=lS[0], setLoading=lS[1];
  var sS=useState(0); var syncing=sS[0], setSyncing=sS[1];
  var ref=useRef([]);
  var pendingRef=useRef(0);
  var loadedRef=useRef(false);
  var migratedRef=useRef(false);
  var lastLoadRef=useRef(0);
  var notifyRef=useRef(notify); notifyRef.current=notify;

  function say(m,t){ if(notifyRef.current) notifyRef.current(m,t||"info"); }
  function apply(list){ ref.current=list; setItems(list); }

  var load=useCallback(function(silent){
    if(!silent) setLoading(true);
    lastLoadRef.current=Date.now();
    return api.get("colGet&col="+col).then(function(res){
      if(!res||res.ok===false||res.error||!Array.isArray(res.items)) throw new Error((res&&res.error)||"Respuesta inválida");
      var list=res.items.filter(function(x){ return x&&x.id; });
      if(opts.sort) list.sort(opts.sort);
      loadedRef.current=true;
      if(pendingRef.current===0 && JSON.stringify(list)!==JSON.stringify(ref.current)) apply(list);
      setLoading(false);
      return true;
    }).catch(function(){
      setLoading(false);
      if(!silent) say("No se pudieron cargar los "+label+" desde la nube","warning");
      return false;
    });
  },[col]);

  /* Migración única: sube lo que haya quedado en localStorage de versiones anteriores */
  function migrateLocal(){
    if(!opts.localKey || migratedRef.current) return Promise.resolve();
    migratedRef.current=true;
    var raw=null; try{ raw=localStorage.getItem(opts.localKey); }catch(e){}
    if(!raw) return Promise.resolve();
    var local=[]; try{ local=JSON.parse(raw)||[]; }catch(e){ return Promise.resolve(); }
    if(!Array.isArray(local)) return Promise.resolve();
    var inCloud={}; ref.current.forEach(function(x){ inCloud[x.id]=true; });
    var toUp=local.filter(function(x){ return x&&x.id&&!inCloud[x.id]; });
    function retireLocal(){
      try{ localStorage.setItem(opts.localKey+"_respaldo_migrado",raw); localStorage.removeItem(opts.localKey); }catch(e){}
    }
    if(toUp.length===0){ retireLocal(); return Promise.resolve(); }
    return api.post("colSave",{col:col,items:toUp}).then(function(res){
      if(res&&res.ok){
        retireLocal();
        var merged=ref.current.concat(toUp);
        if(opts.sort) merged.sort(opts.sort);
        apply(merged);
        say("Se subieron "+toUp.length+" "+label+" a la nube","success");
      } else {
        say("No se pudieron subir los "+label+" guardados en este dispositivo","warning");
      }
    }).catch(function(){ say("No se pudieron subir los "+label+" guardados en este dispositivo","warning"); });
  }

  useEffect(function(){
    if(!loggedIn) return;
    load(false).then(function(ok){ if(ok) migrateLocal(); });
  },[loggedIn,load]);

  /* Al volver a la app (otro dispositivo pudo haber cambiado datos) se refresca solo */
  useEffect(function(){
    if(!loggedIn) return;
    function refresh(){
      if(document.visibilityState!=="visible") return;
      if(pendingRef.current>0||!loadedRef.current) return;
      if(Date.now()-lastLoadRef.current<15000) return;
      load(true);
    }
    document.addEventListener("visibilitychange",refresh);
    window.addEventListener("focus",refresh);
    return function(){ document.removeEventListener("visibilitychange",refresh); window.removeEventListener("focus",refresh); };
  },[loggedIn,load]);

  function commit(next){
    var prev=ref.current;
    var prevMap={}; prev.forEach(function(x){ prevMap[x.id]=JSON.stringify(x); });
    var nextMap={}; next.forEach(function(x){ nextMap[x.id]=true; });
    var changed=next.filter(function(x){ return prevMap[x.id]!==JSON.stringify(x); });
    var removed=prev.filter(function(x){ return !nextMap[x.id]; }).map(function(x){ return x.id; });
    apply(next);
    if(changed.length===0&&removed.length===0) return Promise.resolve(true);
    pendingRef.current++; setSyncing(pendingRef.current);
    var jobs=[];
    if(changed.length) jobs.push(api.post("colSave",{col:col,items:changed}));
    if(removed.length) jobs.push(api.post("colDelete",{col:col,ids:removed}));
    return Promise.all(jobs).then(function(rs){
      var bad=rs.filter(function(r){ return !r||!r.ok; });
      if(bad.length) throw new Error((bad[0]&&bad[0].error)||"error");
      return true;
    }).catch(function(){
      say("No se pudo guardar en la nube. Se restauran los datos desde Google Sheets.","warning");
      return false;
    }).then(function(ok){
      pendingRef.current--; setSyncing(pendingRef.current);
      if(!ok) load(true);
      return ok;
    });
  }

  function upsert(item){
    var cur=ref.current;
    var exists=cur.some(function(x){ return x.id===item.id; });
    var next=exists?cur.map(function(x){ return x.id===item.id?item:x; }):(opts.prepend?[item].concat(cur):cur.concat([item]));
    return commit(next);
  }
  function remove(id){ return commit(ref.current.filter(function(x){ return x.id!==id; })); }

  return {items:items,loading:loading,syncing:syncing,save:commit,upsert:upsert,remove:remove,reload:function(){ return load(false); }};
}

function usePresupuestos(loggedIn,notify){
  var c=useCloudList("presupuestos",loggedIn,notify,{
    label:"presupuestos",localKey:"presupuestos_v3",prepend:true,
    sort:function(a,b){ return (parseInt(b.id,10)||0)-(parseInt(a.id,10)||0); }
  });
  return {presupuestos:c.items,loading:c.loading,syncing:c.syncing,save:c.save,upsert:c.upsert,remove:c.remove,reload:c.reload};
}

/* --- MoneyInput --- */
function MoneyInput(props){
  var value=props.value, onChange=props.onChange, placeholder=props.placeholder, extStyle=props.style||{};
  var rawS=useState(function(){var n=parseMoney(value);return n?String(n):"";});
  var raw=rawS[0], setRaw=rawS[1];
  var focS=useState(false); var focused=focS[0], setFocused=focS[1];
  useEffect(function(){ if(!focused){var n=parseMoney(value);setRaw(n?String(n):"");} },[value,focused]);
  function handleChange(e){ var d=e.target.value.replace(/[^\d]/g,""); setRaw(d); onChange(d===""?"":parseInt(d,10)); }
  var display=raw?parseInt(raw,10).toLocaleString("es-AR",{maximumFractionDigits:0}):"";
  return h("input",{type:"text",inputMode:"numeric",value:display,placeholder:placeholder||"0",
    onChange:handleChange,
    onFocus:function(e){setFocused(true);setTimeout(function(){e.target.select();},0);},
    onBlur:function(){setFocused(false);},
    style:merge({fontVariantNumeric:"tabular-nums"},extStyle)});
}

function BalanceChart(props){
  var data=props.data, type=props.type, title=props.title;
  var canvasRef=useRef(null);
  var chartInst=useRef(null);

  useEffect(function(){
    if(!canvasRef.current) return;
    if(chartInst.current) chartInst.current.destroy();
    if(typeof Chart==="undefined") return;
    var ctx=canvasRef.current.getContext("2d");
    chartInst.current=new Chart(ctx,{
      type:type,
      data:data,
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          title:{display:!!title,text:title,font:{family:"'DM Serif Display', serif",size:14,weight:'bold'}}
        },
        scales:(type==='bar'||type==='line')?{
          y:{beginAtZero:true,ticks:{callback:function(value){ return '$'+value.toLocaleString("es-AR"); }}}
        }:undefined
      }
    });
    return function(){ if(chartInst.current) chartInst.current.destroy(); };
  },[data,type,title]);

  return h("div",{style:{position:"relative",height:560,width:"100%"}}, h("canvas",{ref:canvasRef}));
}

function parsePresupuestoNro(str){
  var s=String(str||"").trim();
  if(!s) return {anio:"",num:""};
  var m=s.match(/^(\d{2,4})\s*-\s*(.+)$/);
  if(m) return {anio:m[1], num:m[2]};
  if(/^\d{2,4}$/.test(s)) return {anio:s, num:""};
  return {anio:"", num:s};
}

    };
  }

  function handleAceptar(p){
    if(parseMoney(p.monto)>0){
      if(!confirm("Aceptar presupuesto y enviarlo a Trabajos?")) return;
      if(acceptingRef.current) return;
      acceptingRef.current=true;
      Promise.resolve(props.onAccept?props.onAccept(buildTrabajo(p,p.monto,p.anticipo,p.cantCuotas,p.moneda)):true).then(function(ok){

/* --- BalanceTab --- */
function BalanceTab(props){
  var trabajos=props.trabajos;
  var defFin=addDays(todayStr(),-30);
  var dsS=useState(defFin); var dateStart=dsS[0], setDateStart=dsS[1];
  var deS=useState(todayStr()); var dateEnd=deS[0], setDateEnd=deS[1];
  var selS=useState(null); var selObra=selS[0], setSelObra=selS[1];
  var monS=useState("ARS"); var monFilter=monS[0], setMonFilter=monS[1];
  var monSym=monFilter==="USD"?"U$S ":"$ ";

  var ctS=useState("doughnut"); var chartType=ctS[0], setChartType=ctS[1];
  var gbS=useState("obra"); var groupBy=gbS[0], setGroupBy=gbS[1];

  var filteredWorksForBalance=useMemo(function(){ return trabajos; },[trabajos]);

  var cobros=useMemo(function(){
    var arr=[];
    filteredWorksForBalance.forEach(function(t){
      if((t.moneda||"ARS")!==monFilter) return;
      var arch=esArchivado(t);
      if(t.anticipoPagado&&parseMoney(t.anticipo)>0){
        var fechaAnt=t.fechaPagoAnticipo||t.fecha||"";
        if(fechaAnt>=dateStart&&fechaAnt<=dateEnd){
          arr.push({obraId:t.id,obra:t.obra,tipo:"Anticipo",monto:parseMoney(t.anticipo),fecha:fechaAnt,factura:t.facturaAnticipo||"",archivado:arch,moneda:t.moneda||"ARS"});
        }
      }
      if(t.pagoPagado&&parseMoney(t.anticipo)===0){
        var fechaFull=t.fechaPagoFull||t.fecha||"";
        if(fechaFull>=dateStart&&fechaFull<=dateEnd){
          arr.push({obraId:t.id,obra:t.obra,tipo:"Pago unico",monto:parseMoney(t.monto),fecha:fechaFull,factura:t.facturaFull||"",archivado:arch,moneda:t.moneda||"ARS"});
        }
      }
      (t.cuotas||[]).forEach(function(c){
        if(c.pagada){
          var fechaCuota=c.fechaPago||c.fecha||"";
          if(fechaCuota>=dateStart&&fechaCuota<=dateEnd){
            arr.push({obraId:t.id,obra:t.obra,tipo:"Cuota",monto:parseMoney(c.monto),fecha:fechaCuota,factura:c.nroFactura||"",archivado:arch,moneda:t.moneda||"ARS"});
          }
        }
      });
    });
    arr.sort(function(a,b){ return b.fecha.localeCompare(a.fecha); });
    return arr;
  },[filteredWorksForBalance,dateStart,dateEnd,monFilter]);

  var totalPeriodo=cobros.reduce(function(s,c){ return s+c.monto; },0);

  var porObra=useMemo(function(){
    var map={};
    cobros.forEach(function(c){ if(!map[c.obra]) map[c.obra]={label:c.obra,value:0}; map[c.obra].value+=c.monto; });
    var arr=[]; Object.keys(map).forEach(function(k){ arr.push(map[k]); });
    arr.sort(function(a,b){ return b.value-a.value; });
    return arr;
  },[cobros]);

  var porTipo=useMemo(function(){
    var map={};
    cobros.forEach(function(c){ if(!map[c.tipo]) map[c.tipo]={label:c.tipo,value:0}; map[c.tipo].value+=c.monto; });
    var arr=[]; Object.keys(map).forEach(function(k){ arr.push(map[k]); });
    return arr;
  },[cobros]);

  var porMes=useMemo(function(){
    var map={};
    cobros.forEach(function(c){
      var mesStr=c.fecha.substring(0,7);
      if(!map[mesStr]) map[mesStr]={label:mesStr,value:0};
      map[mesStr].value+=c.monto;
    });
    var arr=[]; Object.keys(map).forEach(function(k){ arr.push(map[k]); });
    arr.sort(function(a,b){ return a.label.localeCompare(b.label); });
    return arr;
  },[cobros]);

  var proyeccionesFuturas=useMemo(function(){
    var map={};
    filteredWorksForBalance.forEach(function(t){
      if((t.moneda||"ARS")!==monFilter) return;
      (t.cuotas||[]).forEach(function(c){
        if(!c.pagada&&!c.indefinida){
          var hoy=todayStr();
          if(c.fecha>=hoy){
            var mesStr=c.fecha.substring(0,7);
            if(!map[mesStr]) map[mesStr]={label:mesStr,value:0};
            map[mesStr].value+=parseMoney(c.monto);
          }
        }
      });
      if(!t.anticipoPagado&&parseMoney(t.anticipo)>0&&t.fecha>=todayStr()){
        var mesAnt=t.fecha.substring(0,7);
        if(!map[mesAnt]) map[mesAnt]={label:mesAnt,value:0};
        map[mesAnt].value+=parseMoney(t.anticipo);
      }
      if(parseMoney(t.anticipo)===0&&!t.pagoPagado&&t.fecha>=todayStr()){
        var mesFull=t.fecha.substring(0,7);
        if(!map[mesFull]) map[mesFull]={label:mesFull,value:0};
        map[mesFull].value+=parseMoney(t.monto);
      }
    });
    var arr=[]; Object.keys(map).forEach(function(k){ arr.push(map[k]); });
    arr.sort(function(a,b){ return a.label.localeCompare(b.label); });
    return arr;

  var barrioResult=useBarrioResolver(trabajos,cobros,monFilter);

    var EXTENDED_COLORS=["#2563eb","#7c3aed","#db2777","#ea580c","#16a34a","#0891b2","#ca8a04","#dc2626","#4f46e5","#059669","#f59e0b","#8b5cf6","#ec4899","#10b981","#3b82f6","#ef4444","#06b6d4","#84cc16","#f97316","#a855f7","#14b8a6","#e11d48","#6366f1","#22c55e","#eab308"];
    var colors=currentGroup.map(function(_,i){ return EXTENDED_COLORS[i%EXTENDED_COLORS.length]; });

    return {
      labels:currentGroup.map(function(item){ return item.label; }),
      datasets:[{

    };
  },[porObra,porTipo,porMes,porBarrio,proyeccionesFuturas,groupBy,monFilter]);

  var detalle=selObra?cobros.filter(function(c){ return c.obra===selObra; }):cobros;
  var iS={background:T.surfaceAlt,border:"1px solid "+T.border,borderRadius:8,padding:"8px 10px",color:T.text,fontSize:13,outline:"none",fontFamily:"inherit"};

      h("h2",{style:{fontFamily:"'DM Serif Display',serif",fontSize:24,margin:0,color:T.text}},"Dashboard de Balance"),
      totalPeriodo>0&&h("button",{
        onClick:exportarBalancePDF,
        style:{padding:"8px 16px",background:"#f0fdf4",border:"1px solid #86efac",borderRadius:8,color:"#15803d",cursor:"pointer",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:6}
      },
        h("span",null,"PDF"),
        h("span",{style:{fontSize:11,opacity:.8}},"Exportar balance")
      )
    ),

    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(220px, 1fr))",gap:14,marginBottom:18}},
      h("div",{style:{background:"linear-gradient(135deg,#1e40af,#3730a3)",borderRadius:16,padding:"18px 20px",color:"white",boxShadow:"0 4px 16px rgba(37,99,235,.2)"}},
        h("p",{style:{margin:0,fontSize:10,fontWeight:700,letterSpacing:".1em",opacity:.8}},"TOTAL COBRADO EN EL PERIODO"),
        h("p",{style:{margin:"6px 0 0",fontSize:26,fontWeight:700,fontVariantNumeric:"tabular-nums"}},monSym+fmt(totalPeriodo)),
        h("p",{style:{margin:"4px 0 0",fontSize:11,opacity:.75}},cobros.length+" cobros registrados")
      ),
      h("div",{style:{background:T.surface,border:"1px solid "+T.border,borderRadius:16,padding:"18px 20px",boxShadow:"0 1px 4px rgba(0,0,0,.05)"}},
        h("p",{style:{margin:0,fontSize:10,fontWeight:700,letterSpacing:".1em",color:T.textSoft}},"PROMEDIO DE COBRO POR OBRA"),
        h("p",{style:{margin:"6px 0 0",fontSize:26,fontWeight:700,color:T.text,fontVariantNumeric:"tabular-nums"}},monSym+fmt(porObra.length>0?Math.round(totalPeriodo/porObra.length):0)),
        h("p",{style:{margin:"4px 0 0",fontSize:11,color:T.textSoft}},"En "+porObra.length+" obras distintas")
      ),
      h("div",{style:{background:T.surface,border:"1px solid "+T.border,borderRadius:16,padding:"18px 20px",boxShadow:"0 1px 4px rgba(0,0,0,.05)"}},
        h("p",{style:{margin:0,fontSize:10,fontWeight:700,letterSpacing:".1em",color:T.textSoft}},"COBROS FUTUROS PROYECTADOS"),
        h("p",{style:{margin:"6px 0 0",fontSize:26,fontWeight:700,color:"#10b981",fontVariantNumeric:"tabular-nums"}},monSym+fmt(proyeccionesFuturas.reduce(function(sum,item){ return sum+item.value; },0))),
        h("p",{style:{margin:"4px 0 0",fontSize:11,color:T.textSoft}},"Flujo de caja estimado")

    h("div",{style:{background:T.surface,border:"1px solid "+T.border,borderRadius:14,padding:"16px",marginBottom:18}},
      h("p",{style:{color:T.text,fontSize:12,fontWeight:700,letterSpacing:".06em",marginBottom:10}},"PARAMETRIZAR GRÁFICOS Y FILTROS"),
      h("div",{style:{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}},
        h("div",{style:{display:"flex",flexDirection:"column",gap:4}},

        h("div",{style:{display:"flex",flexDirection:"column",gap:4}},
          h("label",{style:{fontSize:11,color:T.textSoft,fontWeight:700}},"TIPO GRÁFICO"),

            h("div",{style:{height:"100%",width:(barrioTotal>0?Math.round((barrioResolved/barrioTotal)*100):0)+"%",background:"linear-gradient(90deg,#2563eb,#7c3aed)",borderRadius:4,transition:"width .4s ease"}})

/* --- Assistant QA Engine --- */
async function getAssistantAnswerAsync(query,trabajos,alertas){
  var q=(query||"").toLowerCase().trim();
  if(!q) return "Escribí una pregunta para que pueda ayudarte 👷‍♂️.";

  if(q.indexOf("clima")!==-1||q.indexOf("tiempo")!==-1||q.indexOf("temperatura")!==-1||q.indexOf("pronostico")!==-1){
    try{
      var res=await fetch("https://api.open-meteo.com/v1/forecast?latitude=-34.6037&longitude=-58.3816&current_weather=true");
      var data=await res.json();
      if(data&&data.current_weather){
        var temp=Math.round(data.current_weather.temperature);
        var wind=Math.round(data.current_weather.windspeed);
        var code=data.current_weather.weathercode;
        var desc=(code===0?"cielo despejado ☀️":code<=3?"parcialmente nublado ⛅":code<=67?"lluvioso 🌧️":"inestable 🌦️");
        return "☀️ El clima actual en Buenos Aires es de "+temp+"°C con "+desc+". Viento a "+wind+" km/h. ¡Buen día para la obra! 🏗️";
      }
    }catch(e){}
    return "🌤️ El clima estimado para la zona es de 21°C con buenas condiciones para trabajar exterior.";
  }

  if(q.indexOf("lluvia")!==-1||q.indexOf("llover")!==-1||q.indexOf("precipitacion")!==-1||q.indexOf("tormenta")!==-1){
    try{
      var res2=await fetch("https://api.open-meteo.com/v1/forecast?latitude=-34.6037&longitude=-58.3816&daily=weathercode,precipitation_probability_max,temperature_2m_max&timezone=America%2FArgentina%2FBuenos_Aires");
      var d2=await res2.json();
      if(d2&&d2.daily&&d2.daily.time){
        var rainDays=[];
        var dayNames=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
        d2.daily.time.forEach(function(tStr,i){
          var prob=(d2.daily.precipitation_probability_max||[])[i]||0;
          var code=(d2.daily.weathercode||[])[i]||0;
          var isRainy=(code>=51&&code<=67)||(code>=80&&code<=82)||(code>=95&&code<=99);
          if(prob>=30||isRainy){
            var parts=tStr.split("-");
            var dObj=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
            rainDays.push("• "+dayNames[dObj.getDay()]+" "+parts[2]+"/"+parts[1]+": "+prob+"% prob. de lluvia 🌧️");
          }
        });
        if(rainDays.length>0) return "🌧️ Próximos días con probabilidad de lluvia:\n"+rainDays.join("\n")+"\n\n💡 Planificá las tareas de exterior considerando estas fechas.";
        return "☀️ ¡Buenas noticias para la obra! No se prevén lluvias significativas en los próximos 7 días.";
      }
    }catch(e){}
    return "🌧️ Pronóstico de lluvias: se prevé tiempo inestable hacia mediados de semana.";
  }

  if(q.indexOf("feriado")!==-1||q.indexOf("fin de semana largo")!==-1||q.indexOf("no laborable")!==-1){
    try{
      var year=new Date().getFullYear();
      var res3=await fetch("https://nolaborables.com.ar/api/v2/feriados/"+year);
      var data3=await res3.json();
      if(Array.isArray(data3)&&data3.length>0){
        var now=new Date(); var m=now.getMonth()+1; var d=now.getDate();
        var upcoming=data3.find(function(f){ return f.mes>m||(f.mes===m&&f.dia>=d); });
        if(upcoming){
          var months=["","Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
          return "🇦🇷 Próximo feriado en Argentina: "+upcoming.dia+" de "+months[upcoming.mes]+" ("+upcoming.motivo+").";
        }
      }
    }catch(e){}
    return "🇦🇷 Próximos feriados nacionales: consultá el calendario oficial.";
  }

  if(q.indexOf("barrio")!==-1||q.indexOf("rentable")!==-1||q.indexOf("facturac")!==-1){
    var obraBarrioMap={};
    try{ obraBarrioMap=JSON.parse(localStorage.getItem("barrioCache_v2")||"{}")||{}; }catch(e){ obraBarrioMap={}; }
    function _normKey(s){ return (s||"").toLowerCase().replace(/[^a-z0-9 ñáéíóú]/g,"").replace(/\s+/g," ").trim(); }
    var barrioTotals={};
    (trabajos||[]).forEach(function(t){
      var obra=t.obra||""; var key=_normKey(obra);
      var barrio=obraBarrioMap[key]||obraBarrioMap[obra];
      if(!barrio||barrio==="Desconocido"||barrio==="Pendiente...") return;
      barrioTotals[barrio]=(barrioTotals[barrio]||0)+parseMoney(t.monto);
    });
    var sorted=Object.keys(barrioTotals).sort(function(a,b){ return barrioTotals[b]-barrioTotals[a]; });
    if(sorted.length>0){
      var lines=["🏆 Ranking de barrios por volumen contratado:\n"];
      var medals=["🥇","🥈","🥉","4️⃣","5️⃣"];
      sorted.slice(0,5).forEach(function(b,i){ lines.push((medals[i]||"•")+" "+b+": $ "+fmt(barrioTotals[b])); });
      if(sorted.length>5) lines.push("... y "+(sorted.length-5)+" barrio(s) más.");
      return lines.join("\n");
    }
    return "Podés ver el desglose detallado por barrio ingresando a la pestaña 'Balance' 📊.";
  }

  if(q.indexOf("obra")!==-1||q.indexOf("trabajo")!==-1||q.indexOf("cant")!==-1){
    var yearMatch=q.match(/\b(20\d\d)\b/);
    var targetYear=yearMatch?yearMatch[1]:null;
    var filtered=(trabajos||[]).filter(function(t){ return !targetYear||(t.fecha&&t.fecha.startsWith(targetYear)); });
    var act=filtered.filter(function(t){ return !esArchivado(t); }).length;
    var arch=filtered.filter(function(t){ return esArchivado(t); }).length;
    return "🏗️ Obras"+(targetYear?" en "+targetYear:"")+" (Total: "+filtered.length+"):\n• 🟢 Activas: "+act+"\n• 📁 Archivadas: "+arch;
  }

  if(q.indexOf("alerta")!==-1||q.indexOf("pendiente")!==-1||q.indexOf("vencid")!==-1){
    if(!alertas||alertas.length===0) return "¡Excelente! No tenés ninguna alerta ni cobro pendiente por vencer 👷‍♂️.";
    return "Tenés "+alertas.length+" alerta"+(alertas.length>1?"s":"")+" activa"+(alertas.length>1?"s":"")+". Revisá la pestaña 'Alertas'.";
  }

  if(q.indexOf("monto")!==-1||q.indexOf("deuda")!==-1||q.indexOf("cobrar")!==-1||q.indexOf("saldo")!==-1){
    var totalARS=0,totalUSD=0;
    (trabajos||[]).forEach(function(t){
      var m=parseMoney(t.monto); var ant=parseMoney(t.anticipo);
      var saldo=m-ant;
      if(t.cuotas&&t.cuotas.length>0){
        t.cuotas.forEach(function(c){ if(!c.pagada){ if(t.moneda==="USD") totalUSD+=parseMoney(c.monto); else totalARS+=parseMoney(c.monto); } });
      } else {
        if(!t.pagoPagado){ if(t.moneda==="USD") totalUSD+=saldo; else totalARS+=saldo; }
      }
    });
    var res="El saldo pendiente por cobrar estimado es: $ "+fmt(totalARS);
    if(totalUSD>0) res+=" y U$S "+fmt(totalUSD);
    return res+" 👷‍♂️.";
  }

  if(q.indexOf("hola")!==-1||q.indexOf("buen")!==-1||q.indexOf("ayuda")!==-1){
    return "¡Hola! Soy tu asistente virtual de obra 👷‍♂️. Podés preguntarme sobre el clima, próximos feriados, saldos o estadísticas.";
  }

  return "Entendido 👷‍♂️. Podés preguntarme sobre 'clima', 'feriados', 'barrio más rentable' o 'obras 2026'.";
}

function AssistantWidget(props){
  var alertas=props.alertas||[];

  var hiddenS=useState(false); var hidden=hiddenS[0], setHidden=hiddenS[1];
  var openS=useState(false); var chatOpen=openS[0], setChatOpen=openS[1];
  var voiceS=useState(true); var voiceEnabled=voiceS[0], setVoiceEnabled=voiceS[1];
  var cS=useState(0); var currentIndex=cS[0], setCurrentIndex=cS[1];
  var vS=useState(true); var visible=vS[0], setVisible=vS[1];

  var defaultTips=["¡Todo al día por acá! 👷‍♂️","Podés consultar la pestaña Balance para ver estadísticas 📊","¡Hacé click en mí para preguntarme sobre clima, feriados o presupuestos! 💬"];

  var chatS=useState([{sender:"bot",text:"¡Hola! Soy tu asistente de obra 👷‍♂️. Puedo informarte sobre el clima, feriados en Argentina o desgloses de obras."}]);
  var chatMsgs=chatS[0], setChatMsgs=chatS[1];
  var inputS=useState(""); var inputVal=inputS[0], setInputVal=inputS[1];
  var chatBodyRef=useRef(null);

  useEffect(function(){
    if(window.speechSynthesis){
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged=function(){ window.speechSynthesis.getVoices(); };
    }
  },[]);

  function speakText(textToSpeak){
    if(!voiceEnabled||!window.speechSynthesis) return;
    try{
      window.speechSynthesis.cancel();
      var clean=textToSpeak.replace(/U\$S\s*([\d.,]+)/g,'$1 dólares').replace(/\$\s*([\d.,]+)/g,'$1 pesos').replace(/\s+/g,' ').trim();
      if(!clean) return;
      var utterance=new SpeechSynthesisUtterance(clean);
      var voices=window.speechSynthesis.getVoices();
      var esVoices=voices.filter(function(v){ return v.lang&&(v.lang.startsWith('es')||v.lang.indexOf('es-')!==-1); });
      var arVoice=esVoices.find(function(v){ var name=(v.name||"").toLowerCase(); var lang=(v.lang||"").toLowerCase(); return lang.indexOf('ar')!==-1||name.indexOf('argentina')!==-1; });
      var selectedVoice=arVoice||esVoices[0];
      if(selectedVoice) utterance.voice=selectedVoice;
      utterance.lang='es-AR'; utterance.rate=1.0; utterance.pitch=0.95;
      window.speechSynthesis.speak(utterance);
    }catch(e){}
  }

  function toggleVoice(){ if(voiceEnabled&&window.speechSynthesis) window.speechSynthesis.cancel(); setVoiceEnabled(!voiceEnabled); }

  useEffect(function(){
    if(chatOpen&&chatBodyRef.current){
      setTimeout(function(){ if(chatBodyRef.current) chatBodyRef.current.scrollTop=chatBodyRef.current.scrollHeight; },50);
    }
  },[chatMsgs,chatOpen]);

  useEffect(function(){
    var list=alertas.length>0?alertas:defaultTips;
    var interval=setInterval(function(){
      setVisible(false);
      setTimeout(function(){ setCurrentIndex(function(prev){ return (prev+1)%list.length; }); setVisible(true); },300);
    },5000);
    return function(){ clearInterval(interval); };
  },[alertas.length]);

  async function handleSend(userText){
    var txt=userText||inputVal;
    if(!txt||!txt.trim()) return;
    var userMsg=txt.trim();
    var newMsgs=chatMsgs.concat([{sender:"user",text:userMsg},{sender:"bot",text:"Consultando información... ⏳",loading:true}]);
    setChatMsgs(newMsgs);
    setInputVal("");
    var answer=await getAssistantAnswerAsync(userMsg,trabajos,alertas);
    setChatMsgs(function(prev){
      var filtered=prev.filter(function(m){ return !m.loading; });
      return filtered.concat([{sender:"bot",text:answer}]);
    });
    speakText(answer);
  }

  if(hidden){
    return h("div",{className:"assistant-widget"},
      h("button",{className:"assistant-minimized-btn",onClick:function(){setHidden(false);}},"👷‍♂️ Asistente")
    );
  }

  var displayMsg="";
  if(alertas.length>0){
    var cur=alertas[currentIndex%alertas.length];
    displayMsg=cur?(cur.trabajo.length>38?cur.trabajo.substring(0,36)+"...":cur.trabajo):"";
  } else {
    displayMsg=defaultTips[currentIndex%defaultTips.length];
  }

  return h("div",{className:"assistant-widget"},
    chatOpen&&h("div",{className:"assistant-chat-box"},
      h("div",{className:"assistant-chat-hdr"},
        h("div",{style:{display:"flex",alignItems:"center",gap:6,fontSize:13,fontWeight:700}},
          h("span",null,"👷‍♂️"), h("span",null,"Asistente de Obra & Web")
        ),
        h("div",{style:{display:"flex",alignItems:"center",gap:8}},
          h("button",{onClick:toggleVoice,title:voiceEnabled?"Silenciar asistente":"Activar voz",style:{background:"none",border:"none",color:voiceEnabled?"#4ade80":"#94a3b8",fontSize:15,cursor:"pointer",padding:0}},voiceEnabled?"🔊":"🔇"),
          h("button",{onClick:function(){ if(window.speechSynthesis) window.speechSynthesis.cancel(); setChatOpen(false); },style:{background:"none",border:"none",color:"#94a3b8",fontSize:16,cursor:"pointer",padding:0}},"✕")
        )
      ),
      h("div",{ref:chatBodyRef,className:"assistant-chat-body"},
        chatMsgs.map(function(m,idx){ return h("div",{key:idx,className:"assistant-chat-msg "+m.sender,style:{whiteSpace:"pre-line"}},m.text); })
      ),
      h("div",{style:{padding:"6px 10px",background:"#f1f5f9",display:"flex",gap:4,flexWrap:"wrap"}},
        h("button",{onClick:function(){handleSend("¿Cuál es el clima hoy?");},style:{fontSize:10,padding:"3px 7px",borderRadius:12,border:"1px solid #cbd5e1",background:"white",cursor:"pointer",color:"#334155"}},"⛅ Clima"),
        h("button",{onClick:function(){handleSend("¿Cuándo son los próximos días con probabilidad de lluvia?");},style:{fontSize:10,padding:"3px 7px",borderRadius:12,border:"1px solid #cbd5e1",background:"white",cursor:"pointer",color:"#334155"}},"🌧️ Lluvias"),
        h("button",{onClick:function(){handleSend("¿Cuándo es el próximo feriado?");},style:{fontSize:10,padding:"3px 7px",borderRadius:12,border:"1px solid #cbd5e1",background:"white",cursor:"pointer",color:"#334155"}},"🇦🇷 Feriados"),
        h("button",{onClick:function(){handleSend("¿Qué barrio me dio más ganancias?");},style:{fontSize:10,padding:"3px 7px",borderRadius:12,border:"1px solid #cbd5e1",background:"white",cursor:"pointer",color:"#334155"}},"🏆 Barrio Top")
      ),
      h("div",{className:"assistant-chat-input-row"},
        h("input",{type:"text",value:inputVal,onChange:function(e){setInputVal(e.target.value);},onKeyDown:function(e){if(e.key==="Enter")handleSend();},placeholder:"Preguntale al asistente...",style:{flex:1,border:"1px solid #cbd5e1",borderRadius:8,padding:"6px 9px",fontSize:12,outline:"none"}}),

      alertas.length>0&&h("span",{style:{fontWeight:"bold",color:"#d97706",marginRight:4}},"⚠️"),
      displayMsg
    ),
    h("button",{className:"assistant-avatar-btn",onClick:function(){setChatOpen(!chatOpen);},title:"Hacé click para hablar con el asistente"},
      h("div",{className:"assistant-avatar"},"👷‍♂️")
    )
  );
}

/* --- ErrorBoundary --- */
var ErrorBoundary=function(props){
  var st=React.useState({error:null,info:null});
  var error=st[0].error, info=st[0].info;
  var setErr=st[1];
  React.useEffect(function(){
    // noop, solo para que el estado se actualice
  },[error]);
  // Usamos clase para que getDerivedStateFromError funcione bien:
  return null;
};

// Implementamos ErrorBoundary como componente de clase:
class AppErrorBoundary extends React.Component{
  constructor(props){
    super(props);
    this.state={error:null,info:null};
  }
  static getDerivedStateFromError(error){
    return {error:error};
  }
  componentDidCatch(error,info){
    this.setState({info:info});
    if(window.__showAppError){
      window.__showAppError(
        "Error durante el render de la aplicación",
        error&&error.message?error.message:String(error),
        (info&&info.componentStack)?info.componentStack.split("\n").slice(0,3).join("\n"):"(componentStack no disponible)",
        error&&error.stack?error.stack:String(error)
      );
    }
  }
  render(){
    if(this.state.error){
      return null; // El overlay ya muestra el error
    }
    return this.props.children;
  }
}

  function handleSaveCuotas(id,cuotas,anticipo,factAnt,antPag,pagoPagado,factFull){
    var prevWork=trabajos.filter(function(t){ return t.id===id; })[0];
    if(!prevWork) return;

    var nextFechaPagoAnticipo=prevWork.fechaPagoAnticipo||"";
    if(antPag&&!prevWork.anticipoPagado){ nextFechaPagoAnticipo=todayStr(); showToast("Pago registrado","warning"); }
    else if(!antPag){ nextFechaPagoAnticipo=""; }
    else if(antPag&&!nextFechaPagoAnticipo){ nextFechaPagoAnticipo=prevWork.fecha||todayStr(); }

    var nextFechaPagoFull=prevWork.fechaPagoFull||"";
    if(pagoPagado&&!prevWork.pagoPagado){ nextFechaPagoFull=todayStr(); showToast("Pago registrado","warning"); }
    else if(!pagoPagado){ nextFechaPagoFull=""; }
    else if(pagoPagado&&!nextFechaPagoFull){ nextFechaPagoFull=prevWork.fecha||todayStr(); }

    var didRegisterCuotaPayment=false;
    var nextCuotas=cuotas.map(function(c){
      var prevC=(prevWork.cuotas||[]).filter(function(pc){ return pc.id===c.id; })[0];
      var wasPagada=prevC?!!prevC.pagada:false;
      var fPago=c.fechaPago||(prevC?prevC.fechaPago:"")||"";
      if(c.pagada&&!wasPagada){ fPago=todayStr(); didRegisterCuotaPayment=true; }
      else if(!c.pagada){ fPago=""; }
      else if(c.pagada&&!fPago){ fPago=c.fecha||todayStr(); }
      return merge(c,{fechaPago:fPago});
    });

    if(didRegisterCuotaPayment) showToast("Pago registrado","warning");

    var updated=trabajos.map(function(t){
      return t.id===id?merge(t,{cuotas:nextCuotas,anticipo:anticipo,facturaAnticipo:factAnt,anticipoPagado:antPag,pagoPagado:pagoPagado,facturaFull:factFull,fechaPagoAnticipo:nextFechaPagoAnticipo,fechaPagoFull:nextFechaPagoFull}):t;
    });
    setTrabajos(updated);
    var target=updated.filter(function(t){ return t.id===id; })[0];
    if(target) updateRemote(target);
    setCuotasModal(null);
  }
